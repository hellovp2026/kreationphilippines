<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/kph-favicon.png">
<link rel="apple-touch-icon" href="/kph-favicon.png">
<title>DKC 2026 After-Party · The Pre Game Davao</title>
<meta name="description" content="Reserve your entry and tables for the official Davao K-Pop Convention 2026 after-party at The Pre Game Davao." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Unbounded:wght@700;800&family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #08020F;
    --bg-soft: #150929;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-elev: #251142;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #FFFFFF;
    --text-muted: #B8A8D0;
    --text-soft: #7A6890;
    --brand: #FF1B6B;
    --brand-2: #C724FF;
    --accent: #00E5FF;
    --success: #00E676;
    --warn: #FFB300;
    --danger: #FF1744;
    --success-bg: rgba(0, 230, 118, 0.12);
    --warn-bg: rgba(255, 179, 0, 0.14);
    --danger-bg: rgba(255, 23, 68, 0.14);
    --cyan-bg: rgba(0, 229, 255, 0.12);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .font-display { font-family: 'Sora', ui-sans-serif; letter-spacing: -0.4px; }
  .font-headline { font-family: 'Unbounded', 'Sora', ui-sans-serif; letter-spacing: -0.5px; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(120px);
    pointer-events: none; z-index: 0;
  }
  input, select { font-family: inherit; background: rgba(255,255,255,0.03); color: var(--text); border: 1px solid var(--border-strong); outline: none; }
  input:focus, select:focus { border-color: var(--brand); }
  ::placeholder { color: var(--text-soft); }
  .spin { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const SUPABASE_URL = 'https://zxichjnifawondqqbrxn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_298EyDyzguh8YMyzPPJeaA_glbUxJfH';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ENTRY_REGULAR = 450;    // includes a drink
const ENTRY_DISCOUNTED = 300; // table min-pax rate, no drink
const ENTRY_WALKIN = 500;     // night-only, informational here
const PREGAME_CUT = 150;

const peso = (n) => '\u20b1' + Number(n || 0).toLocaleString('en-PH');

const TYPE_LABEL = {
  standing: 'Standing Table',
  chairs: 'Table with Chairs',
  vip_couch: 'VIP Couch',
  vip_table: 'VIP Table',
  vip_high: 'VIP High Table',
  vip_mega: 'VIP Mega Couch',
};

function Spinner({ size = 16, color = 'var(--brand)' }) {
  return (
    <span className="spin" style={{
      display: 'inline-block', width: size, height: size,
      border: '2px solid rgba(255,255,255,0.25)', borderTopColor: color,
      borderRadius: '50%',
    }} />
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState(null);
  const [event, setEvent] = useState(null);
  const [avail, setAvail] = useState([]);
  const [step, setStep] = useState('build'); // build | pay | done
  const [doneCode, setDoneCode] = useState(null);

  // tier: null | 'regular' | 'table'
  const [tier, setTier] = useState(null);
  // regular tier: an array of {name, age}
  const [regGuests, setRegGuests] = useState([{ name: '', age: '' }]);
  // table tier: chosen type + assigned id, table guests, extra guests
  const [chosenType, setChosenType] = useState(null);
  const [tableGuests, setTableGuests] = useState([]); // exactly min_pax, {name, age}
  const [extraGuests, setExtraGuests] = useState([]); // 0..leeway, {name, age}

  useEffect(() => {
    (async () => {
      try {
        const evR = await supabase.from('events').select('*').eq('is_active', true).limit(1).maybeSingle();
        if (evR.error) throw evR.error;
        setEvent(evR.data);
        try {
          const aR = await supabase.rpc('after_party_table_availability');
          if (!aR.error && Array.isArray(aR.data)) setAvail(aR.data);
          else console.warn('[availability unavailable]', aR.error && aR.error.message);
        } catch (avErr) { console.warn('[availability failed]', avErr); }
      } catch (e) {
        setLoadErr(e.message || 'Failed to load');
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const chosenTable = chosenType
    ? { table_type: chosenType.table_type, floor: chosenType.floor,
        min_spend: Number(chosenType.min_spend), min_pax: chosenType.min_pax,
        max_pax: chosenType.max_pax, label: chosenType.label,
        assignedId: chosenType.assignedId }
    : null;

  if (loading) return <Centered><Spinner size={26} /></Centered>;
  if (loadErr) return <Centered><div style={{ color: 'var(--warn)', textAlign: 'center' }}>Could not load the after-party page.<br />{loadErr}</div></Centered>;

  return (
    <div style={{ position: 'relative', minHeight: '100vh', overflow: 'hidden' }}>
      <div className="blob" style={{ width: 500, height: 500, background: 'radial-gradient(circle, rgba(255,27,107,0.28), transparent 70%)', top: -250, left: -150 }} />
      <div className="blob" style={{ width: 480, height: 480, background: 'radial-gradient(circle, rgba(0,229,255,0.16), transparent 70%)', bottom: -220, right: -140 }} />
      <div style={{ position: 'relative', zIndex: 1, maxWidth: 780, margin: '0 auto', padding: '28px 18px 80px' }}>
        <Header />
        {step === 'build' && (
          <BuildStep
            avail={avail}
            tier={tier} setTier={setTier}
            regGuests={regGuests} setRegGuests={setRegGuests}
            chosenType={chosenType} setChosenType={setChosenType}
            chosenTable={chosenTable}
            tableGuests={tableGuests} setTableGuests={setTableGuests}
            extraGuests={extraGuests} setExtraGuests={setExtraGuests}
            onProceed={() => setStep('pay')}
          />
        )}
        {step === 'pay' && (
          <PayStep
            event={event}
            tier={tier}
            chosenType={chosenType}
            chosenTable={chosenTable}
            regGuests={regGuests}
            tableGuests={tableGuests}
            extraGuests={extraGuests}
            onBack={() => setStep('build')}
            onDone={(code) => { setDoneCode(code); setStep('done'); }}
          />
        )}
        {step === 'done' && <DoneStep code={doneCode} />}
      </div>
    </div>
  );
}

function Centered({ children }) {
  return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>{children}</div>;
}

function Header() {
  return (
    <div style={{ marginBottom: 26 }}>
      <div style={{ fontSize: 11, letterSpacing: 2.5, color: 'var(--accent)', fontWeight: 700, marginBottom: 10 }}>
        OFFICIAL AFTER-PARTY · THE PRE GAME DAVAO
      </div>
      <h1 className="font-headline" style={{ fontSize: 'clamp(26px, 5vw, 40px)', lineHeight: 1.1, margin: 0, fontWeight: 800 }}>
        Keep the night going at the <span style={{ color: 'var(--brand)' }}>after-party.</span>
      </h1>
      <p style={{ color: 'var(--text-muted)', lineHeight: 1.6, marginTop: 14, fontSize: 15 }}>
        After the convention wraps, the party moves to The Pre Game Davao. Choose how you want in: regular entry, or reserve a group table at a discounted rate. Tables are limited and go first come, first served.
      </p>
    </div>
  );
}

function SectionCard({ children }) {
  return (
    <div style={{ background: 'var(--surface)', borderRadius: 16, border: '1px solid var(--border)', padding: '18px 18px', marginBottom: 16 }}>{children}</div>
  );
}
function SectionTitle({ children }) {
  return <div className="font-display" style={{ fontSize: 15, fontWeight: 800, marginBottom: 12 }}>{children}</div>;
}

// ============================================================
// BUILD STEP  (three tiers)
// ============================================================
function BuildStep({
  avail, tier, setTier, regGuests, setRegGuests,
  chosenType, setChosenType, chosenTable,
  tableGuests, setTableGuests, extraGuests, setExtraGuests, onProceed,
}) {
  const [checking, setChecking] = useState(false);
  const [toast, setToast] = useState('');
  const showToast = (m) => { setToast(m); setTimeout(() => setToast(''), 2600); };

  // ---- Tier selection ----
  const pickTier = (t) => {
    if (t === tier) return;
    setTier(t);
    // reset the other tier's state so they never mix
    if (t === 'regular') {
      setChosenType(null); setTableGuests([]); setExtraGuests([]);
      if (regGuests.length === 0) setRegGuests([{ name: '', age: '' }]);
    } else if (t === 'table') {
      setRegGuests([{ name: '', age: '' }]);
    }
  };

  // ---- Regular tier guest list ----
  const setRegGuest = (i, field, val) => setRegGuests((p) => p.map((g, idx) => idx === i ? Object.assign({}, g, { [field]: val }) : g));
  const addRegGuest = () => setRegGuests((p) => p.concat([{ name: '', age: '' }]));
  const removeRegGuest = (i) => setRegGuests((p) => p.length > 1 ? p.filter((_, idx) => idx !== i) : p);

  // ---- Table tier ----
  const grouped = useMemo(() => {
    const g = { ground: [], second: [] };
    avail.forEach((r) => { (g[r.floor] || (g[r.floor] = [])).push(r); });
    return g;
  }, [avail]);

  const pickType = (row) => {
    if (row.state === 'full') { showToast('That table type is fully booked.'); return; }
    const same = chosenType && chosenType.table_type === row.table_type && chosenType.floor === row.floor;
    if (same) { setChosenType(null); setTableGuests([]); setExtraGuests([]); return; }
    setChosenType({
      table_type: row.table_type, floor: row.floor,
      min_spend: row.min_spend, min_pax: row.min_pax, max_pax: row.max_pax,
      label: TYPE_LABEL[row.table_type] || row.table_type,
    });
    // create exactly min_pax named slots, clear extras
    setTableGuests(Array.from({ length: row.min_pax }, () => ({ name: '', age: '' })));
    setExtraGuests([]);
  };
  const setTableGuest = (i, field, val) => setTableGuests((p) => p.map((g, idx) => idx === i ? Object.assign({}, g, { [field]: val }) : g));
  const leeway = chosenTable ? (chosenTable.max_pax - chosenTable.min_pax) : 0;
  const setExtraGuest = (i, field, val) => setExtraGuests((p) => p.map((g, idx) => idx === i ? Object.assign({}, g, { [field]: val }) : g));
  const addExtra = () => setExtraGuests((p) => p.length < leeway ? p.concat([{ name: '', age: '' }]) : p);
  const removeExtra = (i) => setExtraGuests((p) => p.filter((_, idx) => idx !== i));

  // ---- Totals ----
  const regCount = tier === 'regular' ? regGuests.length : 0;
  const tableDiscCount = tier === 'table' && chosenTable ? chosenTable.min_pax : 0;
  const extraCount = tier === 'table' ? extraGuests.length : 0;
  const entryTotal = regCount * ENTRY_REGULAR + tableDiscCount * ENTRY_DISCOUNTED + extraCount * ENTRY_REGULAR;
  const tableSpend = tier === 'table' && chosenTable ? chosenTable.min_spend : 0;
  const grand = entryTotal + tableSpend;

  // ---- Validation to proceed ----
  const ageOk = (g) => { const a = parseInt(g.age, 10); return a && a >= 18; };
  const nameOk = (g) => g.name && g.name.trim().length >= 2;
  let canProceed = false;
  if (tier === 'regular') {
    canProceed = regGuests.length > 0 && regGuests.every((g) => nameOk(g) && ageOk(g));
  } else if (tier === 'table') {
    canProceed = !!chosenTable
      && tableGuests.length === (chosenTable ? chosenTable.min_pax : -1)
      && tableGuests.every((g) => nameOk(g) && ageOk(g))
      && extraGuests.every((g) => nameOk(g) && ageOk(g));
  }

  const [proceedErr, setProceedErr] = useState('');

  const proceed = async () => {
    setProceedErr('');
    if (!canProceed) {
      setProceedErr('Please complete every guest name and a valid age (18+) before continuing.');
      return;
    }
    if (tier === 'table' && chosenType) {
      setChecking(true);
      try {
        const res = await supabase.rpc('after_party_pick_table', {
          p_table_type: chosenType.table_type, p_floor: chosenType.floor,
        });
        setChecking(false);
        if (res.error || !res.data) { showToast('That table type just sold out. Please pick another.'); return; }
        setChosenType((prev) => prev ? Object.assign({}, prev, { assignedId: res.data }) : prev);
      } catch (e) { setChecking(false); showToast('Could not reserve the table. Please try again.'); return; }
    }
    onProceed();
  };

  return (
    <div>
      {/* TIER SELECTOR */}
      <SectionCard>
        <SectionTitle>1 · Choose your entry</SectionTitle>
        <div style={{ display: 'grid', gap: 10 }}>
          <TierCard
            selected={tier === 'regular'}
            onClick={() => pickTier('regular')}
            eyebrow="TIER 1 · NO TABLE"
            title="Regular Entry"
            price={peso(ENTRY_REGULAR)}
            priceNote="per person · includes a drink"
            desc="Get into the after-party. No table. Pay your entry now and you're set for the night."
          />
          <TierCard
            selected={tier === 'table'}
            onClick={() => pickTier('table')}
            eyebrow="TIER 2 · WITH A TABLE"
            title="Table Entry"
            price={peso(ENTRY_DISCOUNTED)}
            priceNote="per person · reserve a table below"
            desc="Reserve a group table at a discounted per-person rate (no drink). Your table's comfortable capacity gets the discounted rate; extra guests are the regular rate."
          />
          {/* Tier 3 - informational only */}
          <div style={{
            padding: '14px 16px', borderRadius: 12,
            background: 'var(--warn-bg)', border: '1px dashed rgba(255,179,0,0.4)',
          }}>
            <div style={{ fontSize: 10, letterSpacing: 1.5, color: '#FFD37A', fontWeight: 800, marginBottom: 4 }}>TIER 3 · WALK-IN (AT THE DOOR)</div>
            <div style={{ fontSize: 13, color: '#FFD37A', lineHeight: 1.5 }}>
              Walk-in entry on the night is {peso(ENTRY_WALKIN)} (includes a drink) and door slots are limited. Buying online above saves you {peso(ENTRY_WALKIN - ENTRY_REGULAR)} and guarantees your spot.
            </div>
            <div style={{ fontSize: 13, color: '#FFD37A', lineHeight: 1.5, marginTop: 8, fontWeight: 700 }}>
              Pre-registration closes August 15. Reservations are only accepted on or before August 15 {'\u2014'} after that, walk-in rates apply at the door.
            </div>
          </div>
        </div>
      </SectionCard>

      {/* TIER 1 — regular guests */}
      {tier === 'regular' && (
        <SectionCard>
          <SectionTitle>2 · Who's coming? <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-soft)' }}>· 18+ only</span></SectionTitle>
          {regGuests.map((g, i) => (
            <GuestRow key={i} index={i} guest={g}
              onName={(v) => setRegGuest(i, 'name', v)}
              onAge={(v) => setRegGuest(i, 'age', v)}
              onRemove={regGuests.length > 1 ? () => removeRegGuest(i) : null}
              priceLabel={peso(ENTRY_REGULAR) + ' · with drink'} />
          ))}
          <button onClick={addRegGuest} style={addBtnStyle}>+ Add another person</button>
        </SectionCard>
      )}

      {/* TIER 2 — tables */}
      {tier === 'table' && (
        <SectionCard>
          <SectionTitle>2 · Pick your table <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--warn)' }}>· limited, selling fast</span></SectionTitle>
          <p style={{ fontSize: 12.5, color: 'var(--text-soft)', marginTop: -4, marginBottom: 8, lineHeight: 1.5 }}>
            The amount shown is the table's minimum spend, consumable on food, drinks, and more at the bar, paid to The Pre Game Davao. The door entry fee and the table's minimum spend are separate charges.
          </p>
          {['ground', 'second'].map((floor) => (
            <div key={floor} style={{ marginTop: 14 }}>
              <div style={{ fontSize: 11, letterSpacing: 1.5, color: 'var(--text-muted)', fontWeight: 700, marginBottom: 10 }}>
                {floor === 'ground' ? 'GROUND FLOOR' : 'SECOND FLOOR'}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 10 }}>
                {(grouped[floor] || []).map((row) => {
                  const isSel = chosenType && chosenType.table_type === row.table_type && chosenType.floor === row.floor;
                  const isFull = row.state === 'full';
                  const isLow = row.state === 'low';
                  const label = TYPE_LABEL[row.table_type] || row.table_type;
                  return (
                    <button key={row.table_type + row.floor} disabled={isFull} onClick={() => pickType(row)}
                      style={{
                        textAlign: 'left', cursor: isFull ? 'not-allowed' : 'pointer',
                        padding: '16px 16px', borderRadius: 14, position: 'relative',
                        background: isSel ? 'rgba(255,27,107,0.12)' : 'rgba(255,255,255,0.02)',
                        border: '1px solid ' + (isSel ? 'var(--brand)' : 'var(--border)'),
                        opacity: isFull ? 0.45 : 1,
                      }}>
                      {isSel && <div style={{ position: 'absolute', top: 12, right: 12, fontSize: 11, fontWeight: 700, color: 'var(--brand)' }}>SELECTED</div>}
                      {isLow && !isSel && <div style={{ position: 'absolute', top: 12, right: 12, fontSize: 10, fontWeight: 700, color: '#FFD37A', background: 'var(--warn-bg)', border: '1px solid rgba(255,179,0,0.35)', padding: '2px 7px', borderRadius: 999 }}>ONLY A FEW LEFT</div>}
                      {isFull && <div style={{ position: 'absolute', top: 12, right: 12, fontSize: 10, fontWeight: 700, color: 'var(--text-soft)', border: '1px solid var(--border)', padding: '2px 7px', borderRadius: 999 }}>FULLY BOOKED</div>}
                      <div style={{ fontSize: 15.5, fontWeight: 700, marginBottom: 6, paddingRight: 90 }}>{label}</div>
                      <div className="font-display" style={{ fontSize: 22, fontWeight: 800, color: isSel ? 'var(--brand)' : 'var(--text)' }}>{peso(row.min_spend)}</div>
                      <div style={{ fontSize: 11, color: 'var(--text-soft)', marginTop: 2, marginBottom: 8 }}>minimum spend</div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Comfortably seats {row.min_pax}, up to {row.max_pax} {'\u00b7'} first {row.min_pax} at {peso(ENTRY_DISCOUNTED)} each</div>
                    </button>
                  );
                })}
              </div>
            </div>
          ))}

          {chosenTable && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 4 }}>{chosenTable.label} · name your guests</div>
              <div style={{ fontSize: 12.5, color: 'var(--text-soft)', marginBottom: 12, lineHeight: 1.5 }}>
                This table seats {chosenTable.min_pax} at the {peso(ENTRY_DISCOUNTED)} rate (all required). You can bring up to {chosenTable.max_pax} total; each guest beyond {chosenTable.min_pax} pays the regular {peso(ENTRY_REGULAR)} entry. 18+ only.
              </div>
              {tableGuests.map((g, i) => (
                <GuestRow key={'t' + i} index={i} guest={g}
                  onName={(v) => setTableGuest(i, 'name', v)}
                  onAge={(v) => setTableGuest(i, 'age', v)}
                  onRemove={null}
                  priceLabel={peso(ENTRY_DISCOUNTED) + ' · table rate'} />
              ))}
              {leeway > 0 && (
                <div style={{ marginTop: 8 }}>
                  <div style={{ fontSize: 12, color: 'var(--text-soft)', margin: '10px 0 8px' }}>
                    Extra people (optional) {'\u00b7'} up to {leeway} more at {peso(ENTRY_REGULAR)} each
                  </div>
                  {extraGuests.map((g, i) => (
                    <GuestRow key={'e' + i} index={chosenTable.min_pax + i} guest={g}
                      onName={(v) => setExtraGuest(i, 'name', v)}
                      onAge={(v) => setExtraGuest(i, 'age', v)}
                      onRemove={() => removeExtra(i)}
                      priceLabel={peso(ENTRY_REGULAR) + ' · with drink'} />
                  ))}
                  {extraGuests.length < leeway && (
                    <button onClick={addExtra} style={addBtnStyle}>+ Add extra person ({peso(ENTRY_REGULAR)})</button>
                  )}
                  {extraGuests.length >= leeway && (
                    <div style={{ fontSize: 12, color: 'var(--text-soft)', marginTop: 6 }}>That's the maximum this table can seat ({chosenTable.max_pax} total).</div>
                  )}
                </div>
              )}
            </div>
          )}
        </SectionCard>
      )}

      {/* SUMMARY + PROCEED */}
      {tier && (
        <SectionCard>
          <SectionTitle>Your total</SectionTitle>
          <div style={{ fontSize: 13.5, display: 'grid', gap: 7 }}>
            {tier === 'regular' && <SumRow label={regCount + ' × regular @ ' + peso(ENTRY_REGULAR)} value={peso(regCount * ENTRY_REGULAR)} />}
            {tier === 'table' && chosenTable && <SumRow label={chosenTable.min_pax + ' × table @ ' + peso(ENTRY_DISCOUNTED)} value={peso(tableDiscCount * ENTRY_DISCOUNTED)} />}
            {tier === 'table' && extraCount > 0 && <SumRow label={extraCount + ' × extra @ ' + peso(ENTRY_REGULAR)} value={peso(extraCount * ENTRY_REGULAR)} />}
            <div style={{ borderTop: '1px solid var(--border)', margin: '4px 0' }} />
            <SumRow label="Entry subtotal" value={peso(entryTotal)} />
            {tier === 'table' && chosenTable && <SumRow label="Table minimum spend" value={peso(tableSpend)} />}
            <div style={{ borderTop: '1px solid var(--border)', margin: '4px 0' }} />
            <SumRow label="Grand total" value={peso(grand)} big />
          </div>
          {toast && <div style={{ marginTop: 14, padding: '10px 14px', borderRadius: 10, background: 'var(--warn-bg)', border: '1px solid rgba(255,179,0,0.35)', color: '#FFD37A', fontSize: 12.5 }}>{toast}</div>}
          {proceedErr && <div style={{ marginTop: 14, padding: '10px 14px', borderRadius: 10, background: 'var(--danger-bg)', border: '1px solid rgba(255,23,68,0.3)', color: '#FF6B85', fontSize: 12.5 }}>{proceedErr}</div>}
          <button disabled={!canProceed || checking} onClick={proceed}
            style={{
              marginTop: 18, width: '100%', padding: '14px', borderRadius: 12, border: 'none',
              background: canProceed ? 'linear-gradient(90deg, #FF1B6B, #C724FF)' : 'rgba(255,255,255,0.06)',
              color: '#fff', fontWeight: 700, fontSize: 15, cursor: canProceed ? 'pointer' : 'not-allowed', fontFamily: 'inherit',
            }}>
            {checking ? 'Checking table...' : 'Continue to payment \u2192'}
          </button>
        </SectionCard>
      )}
    </div>
  );
}

const addBtnStyle = {
  marginTop: 8, padding: '10px 14px', borderRadius: 10, cursor: 'pointer',
  background: 'rgba(255,255,255,0.04)', border: '1px dashed var(--border-strong)',
  color: 'var(--text-muted)', fontSize: 13, fontWeight: 600, fontFamily: 'inherit', width: '100%',
};

function TierCard({ selected, onClick, eyebrow, title, price, priceNote, desc }) {
  return (
    <button onClick={onClick} style={{
      textAlign: 'left', cursor: 'pointer', padding: '16px 16px', borderRadius: 14,
      background: selected ? 'rgba(255,27,107,0.12)' : 'rgba(255,255,255,0.02)',
      border: '1px solid ' + (selected ? 'var(--brand)' : 'var(--border)'),
      display: 'flex', gap: 14, alignItems: 'flex-start', justifyContent: 'space-between', flexWrap: 'wrap',
    }}>
      <div style={{ flex: '1 1 320px' }}>
        <div style={{ fontSize: 10, letterSpacing: 1.5, color: selected ? 'var(--brand)' : 'var(--text-soft)', fontWeight: 800, marginBottom: 4 }}>{eyebrow}</div>
        <div className="font-display" style={{ fontSize: 17, fontWeight: 800, marginBottom: 4 }}>{title}</div>
        <div style={{ fontSize: 12.5, color: 'var(--text-muted)', lineHeight: 1.5 }}>{desc}</div>
      </div>
      <div style={{ textAlign: 'right' }}>
        <div className="font-display" style={{ fontSize: 20, fontWeight: 800, color: selected ? 'var(--brand)' : 'var(--text)' }}>{price}</div>
        <div style={{ fontSize: 10.5, color: 'var(--text-soft)' }}>{priceNote}</div>
      </div>
    </button>
  );
}

function GuestRow({ index, guest, onName, onAge, onRemove, priceLabel }) {
  return (
    <div style={{ padding: '10px 0', borderBottom: '1px solid var(--border)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
        <div style={{ fontSize: 12, color: 'var(--text-soft)' }}>Guest {index + 1} {'\u00b7'} {priceLabel}</div>
        {onRemove && <button onClick={onRemove} style={{ fontSize: 11, color: 'var(--text-soft)', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', fontFamily: 'inherit' }}>remove</button>}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 96px', gap: 8 }}>
        <input value={guest.name} onChange={(e) => onName(e.target.value)} placeholder="Full name" style={{ padding: '10px 12px', borderRadius: 9, fontSize: 14 }} />
        <input value={guest.age} inputMode="numeric" onChange={(e) => onAge(e.target.value.replace(/[^0-9]/g, ''))} placeholder="Age" style={{ padding: '10px 12px', borderRadius: 9, fontSize: 14 }} />
      </div>
    </div>
  );
}

function SumRow({ label, value, big }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
      <span style={{ color: big ? 'var(--text)' : 'var(--text-muted)', fontWeight: big ? 800 : 500, fontSize: big ? 16 : 13.5 }}>{label}</span>
      <span className="font-display" style={{ color: big ? 'var(--brand)' : 'var(--text)', fontWeight: big ? 800 : 600, fontSize: big ? 18 : 13.5 }}>{value}</span>
    </div>
  );
}

// ============================================================
// PAY STEP  (Tier 1 -> GCash; Tier 2 -> Pre Game QR only)
// ============================================================
function PayStep({ event, tier, chosenType, chosenTable, regGuests, tableGuests, extraGuests, onBack, onDone }) {
  const [buyerName, setBuyerName] = useState('');
  const [buyerEmail, setBuyerEmail] = useState('');
  const [buyerPhone, setBuyerPhone] = useState('');
  const [payRef, setPayRef] = useState('');
  const [receipt, setReceipt] = useState(null);
  const [liability, setLiability] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);
  const fileRef = useRef(null);

  const gcash = (event && event.payment_instructions && event.payment_instructions.gcash) || {};

  // Build guest payload + totals from the tier.
  const guestPayload = useMemo(() => {
    if (tier === 'regular') {
      return regGuests.map((g) => ({ name: g.name.trim(), email: null, phone: null, age: parseInt(g.age, 10), kind: 'regular' }));
    }
    if (tier === 'table') {
      const disc = tableGuests.map((g) => ({ name: g.name.trim(), email: null, phone: null, age: parseInt(g.age, 10), kind: 'discounted' }));
      const ext = extraGuests.map((g) => ({ name: g.name.trim(), email: null, phone: null, age: parseInt(g.age, 10), kind: 'regular' }));
      return disc.concat(ext);
    }
    return [];
  }, [tier, regGuests, tableGuests, extraGuests]);

  const entryTotal = guestPayload.reduce((s, g) => s + (g.kind === 'discounted' ? ENTRY_DISCOUNTED : ENTRY_REGULAR), 0);
  const tableSpend = tier === 'table' && chosenTable ? chosenTable.min_spend : 0;
  const isTable = tier === 'table';
  // What the buyer pays HERE: Tier 1 -> entry to GCash. Tier 2 -> entry + table, all to Pre Game QR.
  const payHereTotal = isTable ? (entryTotal + tableSpend) : entryTotal;

  const validate = () => {
    if (!buyerName.trim()) return 'Please enter the lead booker name.';
    if (!buyerEmail.trim() || buyerEmail.indexOf('@') < 0) return 'Please enter a valid email.';
    if (!buyerPhone.trim()) return 'Please enter a contact number.';
    if (payRef.trim().length < 4) return 'Please enter your payment reference number.';
    if (!receipt) return 'Please upload your payment receipt.';
    if (!liability) return 'Please tick the acknowledgment to continue.';
    return null;
  };

  const uploadReceipt = async (file, prefix) => {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = 'afterparty/' + prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const up = await supabase.storage.from('receipts').upload(path, file, { upsert: false });
    if (up.error) throw new Error('Receipt upload failed: ' + up.error.message);
    return path;
  };

  const submit = async () => {
    const v = validate();
    if (v) { setErr(v); return; }
    setErr(null);
    setSubmitting(true);
    try {
      if (isTable && chosenType) {
        const assignedId = chosenType.assignedId;
        const chk = await supabase.rpc('tables_taken', { p_table_ids: [assignedId] }).then(r => r, () => null);
        if (chk && !chk.error && Array.isArray(chk.data) && chk.data.includes(assignedId)) {
          throw new Error('That table was just taken by someone else. Please go back and choose another.');
        }
      }
      const receiptPath = await uploadReceipt(receipt, isTable ? 'table' : 'entry');

      // For Tier 2 the single Pre Game payment covers both entry and table,
      // so both reference/receipt fields point at that same payment. For
      // Tier 1 it's the entry payment to GCash.
      const rpc = await supabase.rpc('create_after_party_reservation', {
        p_table_id: isTable && chosenType ? chosenType.assignedId : null,
        p_buyer_name: buyerName.trim(),
        p_buyer_email: buyerEmail.trim(),
        p_buyer_phone: buyerPhone.trim(),
        p_entry_reference: payRef.trim(),
        p_entry_receipt_path: receiptPath,
        p_table_reference: isTable ? payRef.trim() : null,
        p_table_receipt_path: isTable ? receiptPath : null,
        p_liability: true,
        p_guests: guestPayload,
        p_order_id: null,
        p_source: 'online',
      });
      if (rpc.error) throw new Error(rpc.error.message);
      onDone(rpc.data);
    } catch (e) {
      setErr(e.message || 'Something went wrong. Please try again.');
      setSubmitting(false);
    }
  };

  return (
    <div>
      <SectionCard>
        <SectionTitle>Lead booker</SectionTitle>
        <Field label="FULL NAME" value={buyerName} onChange={setBuyerName} placeholder="Your name" />
        <Field label="EMAIL" value={buyerEmail} onChange={setBuyerEmail} placeholder="you@email.com" type="email" />
        <Field label="CONTACT NUMBER" value={buyerPhone} onChange={setBuyerPhone} placeholder="+63 9XX XXX XXXX" />
      </SectionCard>

      {/* PAYMENT — routing depends on tier */}
      {isTable ? (
        <SectionCard>
          <SectionTitle>Payment {'\u2192'} The Pre Game Davao</SectionTitle>
          <div style={{ fontSize: 12.5, color: 'var(--text-soft)', marginBottom: 14, lineHeight: 1.5 }}>
            Pay the total below to The Pre Game Davao via their QR. This covers your table's minimum spend and your group's entry in one payment.
          </div>
          <div style={{ padding: 16, borderRadius: 12, marginBottom: 16, textAlign: 'center', background: 'rgba(255,255,255,0.03)', border: '1px solid var(--border-strong)' }}>
            <a href="/pregame-qr.png" target="_blank" rel="noreferrer" style={{ display: 'block', width: 260, maxWidth: '100%', margin: '0 auto 10px' }}>
              <img src="/pregame-qr.png" alt="The Pre Game Social GoTyme Bank InstaPay QR" style={{ width: '100%', display: 'block', borderRadius: 12 }} />
            </a>
            <div style={{ fontSize: 11, color: 'var(--text-soft)', marginBottom: 12 }}>Scan with any InstaPay-enabled app {'\u00b7'} tap the QR to enlarge</div>
            <div className="font-display" style={{ fontSize: 24, fontWeight: 800 }}>{peso(payHereTotal)}</div>
            <div style={{ fontSize: 11, color: 'var(--text-soft)', marginTop: 2 }}>total (table minimum + entry)</div>
          </div>
          <Field label="PAYMENT REFERENCE" value={payRef} onChange={setPayRef} placeholder="e.g. 1234567890" mono />
          <ReceiptUpload file={receipt} setFile={setReceipt} inputRef={fileRef} label="PAYMENT RECEIPT SCREENSHOT" />
        </SectionCard>
      ) : (
        <SectionCard>
          <SectionTitle>Payment {'\u2192'} GCash</SectionTitle>
          <div style={{ padding: 16, borderRadius: 12, marginBottom: 16, background: 'linear-gradient(135deg, rgba(0,124,240,0.18), rgba(0,196,255,0.08))', border: '1px solid rgba(0,196,255,0.3)' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10, flexWrap: 'wrap', gap: 4 }}>
              <div className="font-display" style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, color: 'var(--accent)' }}>SEND VIA GCASH</div>
              <div className="font-display" style={{ fontSize: 24, fontWeight: 800 }}>{peso(payHereTotal)}</div>
            </div>
            <PayLine label="ACCOUNT NAME" value={gcash.account_name || 'Kyla Don'} />
            <PayLine label="NUMBER" value={gcash.account_number || '09534900227'} mono />
          </div>
          <Field label="GCASH REFERENCE NUMBER" value={payRef} onChange={setPayRef} placeholder="e.g. 1234567890" mono />
          <ReceiptUpload file={receipt} setFile={setReceipt} inputRef={fileRef} label="RECEIPT SCREENSHOT" />
        </SectionCard>
      )}

      {/* LIABILITY */}
      <SectionCard>
        <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
          <input type="checkbox" checked={liability} onChange={(e) => setLiability(e.target.checked)} style={{ marginTop: 3, width: 18, height: 18, flexShrink: 0, accentColor: '#FF1B6B' }} />
          <span style={{ fontSize: 12.5, color: 'var(--text-muted)', lineHeight: 1.6 }}>
            I understand that all rules, payments, tickets, and orders inside the bar are held and managed by The Pre Game Davao. Kreation Philippines has no control over the rules or payment structures the bar enforces before or during the party, and Kreation Philippines is not liable for any incident occurring at the bar.
            <span style={{ display: 'block', marginTop: 8, color: 'var(--text)', fontWeight: 700 }}>
              Every guest must bring a physical ID. The bar inspects IDs at the door before entry {'\u2014'} no ID, no entry. It's an 18+ night.
            </span>
          </span>
        </label>
      </SectionCard>

      {err && <div style={{ background: 'var(--danger-bg)', color: '#FF6B85', padding: '11px 14px', borderRadius: 10, fontSize: 12.5, marginBottom: 14, lineHeight: 1.5, border: '1px solid rgba(255,23,68,0.3)' }}>{err}</div>}

      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={onBack} disabled={submitting} style={{ padding: '13px 18px', borderRadius: 12, cursor: 'pointer', background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border-strong)', color: 'var(--text)', fontWeight: 700, fontSize: 14, fontFamily: 'inherit', opacity: submitting ? 0.5 : 1 }}>{'\u2190'} Back</button>
        <button onClick={submit} disabled={submitting} style={{ flex: 1, padding: '13px', borderRadius: 12, border: 'none', background: 'linear-gradient(90deg, #FF1B6B, #C724FF)', color: '#fff', fontWeight: 700, fontSize: 15, cursor: submitting ? 'wait' : 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
          {submitting ? <><Spinner size={15} color="#fff" /> Submitting...</> : 'Submit reservation'}
        </button>
      </div>
    </div>
  );
}

function Field({ label, value, onChange, placeholder, type, mono }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 11, letterSpacing: 1, color: 'var(--text-muted)', fontWeight: 700, marginBottom: 6 }}>{label}</div>
      <input type={type || 'text'} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} className={mono ? 'font-mono' : ''} style={{ width: '100%', padding: '12px 14px', borderRadius: 10, fontSize: 15, boxSizing: 'border-box' }} />
    </div>
  );
}

function PayLine({ label, value, mono }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '5px 0', gap: 10 }}>
      <span style={{ fontSize: 11, letterSpacing: 1, color: 'rgba(255,255,255,0.7)', fontWeight: 600 }}>{label}</span>
      <span className={mono ? 'font-mono' : ''} style={{ fontSize: 14, fontWeight: 700 }}>{value}</span>
    </div>
  );
}

function ReceiptUpload({ file, setFile, inputRef, label }) {
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) { alert('File too large (max 8 MB).'); return; }
    setFile(f);
  };
  return (
    <div>
      <div style={{ fontSize: 11, letterSpacing: 1, color: 'var(--text-muted)', fontWeight: 700, marginBottom: 6 }}>{label}</div>
      <div onClick={() => inputRef.current && inputRef.current.click()} style={{ padding: 16, borderRadius: 12, cursor: 'pointer', textAlign: 'center', background: file ? 'rgba(0,230,118,0.06)' : 'rgba(255,255,255,0.02)', border: '1.5px dashed ' + (file ? 'rgba(0,230,118,0.4)' : 'var(--border-strong)') }}>
        <input type="file" ref={inputRef} accept="image/*" onChange={onFile} style={{ display: 'none' }} />
        {file ? (
          <div><div style={{ fontSize: 13, fontWeight: 600, color: 'var(--success)' }}>{file.name}</div><div style={{ fontSize: 11, color: 'var(--text-soft)', marginTop: 4 }}>{(file.size / 1024).toFixed(0)} KB {'\u00b7'} tap to change</div></div>
        ) : (
          <div><div style={{ fontSize: 13, fontWeight: 600 }}>Tap to upload receipt</div><div style={{ fontSize: 11, color: 'var(--text-soft)', marginTop: 4 }}>PNG or JPG, max 8 MB</div></div>
        )}
      </div>
    </div>
  );
}

function DoneStep({ code }) {
  return (
    <SectionCard>
      <div style={{ textAlign: 'center', padding: '20px 0' }}>
        <div style={{ fontSize: 42, marginBottom: 10 }}>{'\ud83c\udf89'}</div>
        <h2 className="font-headline" style={{ fontSize: 24, margin: '0 0 10px' }}>Reservation received</h2>
        <p style={{ color: 'var(--text-muted)', lineHeight: 1.6, fontSize: 14.5, maxWidth: 460, margin: '0 auto 18px' }}>
          Your reservation is in and awaiting payment verification. Our team checks receipts within 24 hours and will email you once your after-party spot is confirmed.
        </p>
        <div style={{ display: 'inline-block', padding: '10px 18px', borderRadius: 10, background: 'rgba(255,27,107,0.1)', border: '1px solid var(--brand)' }}>
          <div style={{ fontSize: 11, color: 'var(--text-soft)', letterSpacing: 1 }}>YOUR REFERENCE</div>
          <div className="font-mono" style={{ fontSize: 20, fontWeight: 700, color: 'var(--brand)', marginTop: 2 }}>{code}</div>
        </div>
        <p style={{ color: 'var(--text-soft)', fontSize: 12, marginTop: 18 }}>Keep this code. Present the lead booker name at the door.</p>
      </div>
    </SectionCard>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
