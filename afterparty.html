<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/kph-favicon.png">
<link rel="apple-touch-icon" href="/kph-favicon.png">
<title>Grand Encore After Party · The Pre Game Davao</title>
<meta name="description" content="Reserve your pass or table for Grand Encore, the official K-Pop after party at The Pre Game Davao, 22 August 2026." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Unbounded:wght@700;800&family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #08020F;
    --bg-soft: #150929;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-elev: #251142;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #FFFFFF;
    --text-muted: #B8A8D0;
    --text-soft: #7A6890;
    --brand: #FF1B6B;
    --brand-2: #C724FF;
    --accent: #00E5FF;
    --success: #00E676;
    --warn: #FFB300;
    --danger: #FF1744;
    --success-bg: rgba(0, 230, 118, 0.12);
    --warn-bg: rgba(255, 179, 0, 0.14);
    --danger-bg: rgba(255, 23, 68, 0.14);
    --cyan-bg: rgba(0, 229, 255, 0.12);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .font-display { font-family: 'Sora', ui-sans-serif; letter-spacing: -0.4px; }
  .font-headline { font-family: 'Unbounded', 'Sora', ui-sans-serif; letter-spacing: -0.5px; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(120px);
    pointer-events: none; z-index: 0;
  }
  input, select { font-family: inherit; background: rgba(255,255,255,0.03); color: var(--text); border: 1px solid var(--border-strong); outline: none; }
  input:focus, select:focus { border-color: var(--brand); }
  ::placeholder { color: var(--text-soft); }
  .spin { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const SUPABASE_URL = 'https://zxichjnifawondqqbrxn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_298EyDyzguh8YMyzPPJeaA_glbUxJfH';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Mirrors create_grand_encore_reservation. The server is authoritative;
// these exist so the buyer sees a live total before submitting.
const PASS_PRICE  = 450;   // pre-reg pass, and each extra pass on a table
const WALKIN_PRICE = 600;  // door only, never sold here
const CUTOFF = new Date('2026-08-20T23:59:59+08:00');

const GCASH_NAME = 'Kyla Don';
const GCASH_NUM  = '09534900227';

const peso = (n) => '\u20b1' + Number(n || 0).toLocaleString('en-PH');

function Blob({ c, s, t, l, r, b, o }) {
  return <div className="blob" style={{ background: c, width: s, height: s, top: t, left: l, right: r, bottom: b, opacity: o || 0.5 }} />;
}

function Shell({ children }) {
  return (
    <div style={{ position: 'relative', minHeight: '100vh', overflow: 'hidden' }}>
      <Blob c="#FF1B6B" s="480px" t="-160px" l="-140px" o={0.28} />
      <Blob c="#C724FF" s="420px" t="240px" r="-120px" o={0.22} />
      <Blob c="#00E5FF" s="360px" b="-140px" l="18%" o={0.14} />
      <div style={{ position: 'relative', zIndex: 1, maxWidth: 860, margin: '0 auto', padding: '28px 18px 70px' }}>
        {children}
      </div>
    </div>
  );
}

function Header() {
  return (
    <div style={{ textAlign: 'center', marginBottom: 30 }}>
      <div className="font-mono" style={{ fontSize: 11, letterSpacing: 3.5, color: 'var(--accent)', fontWeight: 700, marginBottom: 10 }}>
        THE OFFICIAL K-POP AFTER PARTY
      </div>
      <div className="font-headline" style={{ fontSize: 'clamp(34px, 8vw, 58px)', fontWeight: 800, lineHeight: 1.02, marginBottom: 12 }}>
        Grand<br />Encore
      </div>
      <div style={{ fontSize: 15, color: 'var(--text-muted)', lineHeight: 1.6 }}>
        Saturday 22 August 2026 &nbsp;·&nbsp; from 9:00 PM<br />
        The Pre Game Davao
      </div>
      <div style={{ display: 'inline-flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center', marginTop: 16 }}>
        {['Strictly 18+', 'Physical ID required', 'Complimentary drinks'].map((t) => (
          <span key={t} style={{ fontSize: 11.5, fontWeight: 700, padding: '5px 12px', borderRadius: 999, background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border-strong)', color: 'var(--text-muted)' }}>{t}</span>
        ))}
      </div>
    </div>
  );
}

function Card({ children, style }) {
  return (
    <div style={Object.assign({
      background: 'var(--surface)', border: '1px solid var(--border)',
      borderRadius: 18, padding: '22px 20px', marginBottom: 16,
    }, style || {})}>{children}</div>
  );
}

function Field({ label, value, onChange, ph, type, w }) {
  return (
    <div style={{ flex: w || '1 1 180px', minWidth: 0 }}>
      <div className="font-mono" style={{ fontSize: 10, letterSpacing: 1.2, color: 'var(--text-soft)', fontWeight: 700, marginBottom: 5 }}>{label}</div>
      <input type={type || 'text'} value={value} onChange={(e) => onChange(e.target.value)} placeholder={ph}
        style={{ width: '100%', padding: '11px 13px', borderRadius: 10, fontSize: 14.5, boxSizing: 'border-box' }} />
    </div>
  );
}

// ---------- step 1: what are you booking ----------

function ChooseStep({ avail, choice, setChoice, onNext }) {
  const stateLabel = { available: null, low: 'ONLY A FEW LEFT', full: 'FULLY BOOKED' };

  return (
    <>
      <Card>
        <div className="font-display" style={{ fontSize: 19, fontWeight: 800, marginBottom: 6 }}>Come on your own</div>
        <div style={{ fontSize: 14, color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 16 }}>
          One entry pass per person. Complimentary drinks included. No table.
        </div>
        <button onClick={() => setChoice({ kind: 'pass' })}
          style={{
            width: '100%', textAlign: 'left', cursor: 'pointer', fontFamily: 'inherit',
            padding: '16px 18px', borderRadius: 14,
            background: choice.kind === 'pass' ? 'rgba(255,27,107,0.14)' : 'rgba(255,255,255,0.03)',
            border: '1px solid ' + (choice.kind === 'pass' ? 'var(--brand)' : 'var(--border-strong)'),
          }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' }}>
            <span className="font-headline" style={{ fontSize: 26, fontWeight: 800, color: '#fff' }}>{peso(PASS_PRICE)}</span>
            <span style={{ fontSize: 13.5, color: 'var(--text-muted)' }}>per person</span>
          </div>
        </button>
      </Card>

      <Card>
        <div className="font-display" style={{ fontSize: 19, fontWeight: 800, marginBottom: 6 }}>Book a table</div>
        <div style={{ fontSize: 14, color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 4 }}>
          One all-in price. Every table bundles entry passes for your group <strong style={{ color: '#fff' }}>and</strong> a consumable you spend on food and drinks at the bar.
        </div>
        <div style={{ fontSize: 13, color: 'var(--accent)', lineHeight: 1.6, marginBottom: 18 }}>
          Nothing more to pay at the door. Passes work out at {peso(300)} a head, against {peso(PASS_PRICE)} booking individually.
        </div>

        <div style={{ display: 'grid', gap: 12 }}>
          {avail.map((t) => {
            const key = t.table_type + '|' + t.floor;
            const on = choice.kind === 'table' && choice.key === key;
            const full = t.state === 'full';
            const badge = stateLabel[t.state];
            return (
              <button key={key} disabled={full}
                onClick={() => setChoice({ kind: 'table', key, table: t })}
                style={{
                  textAlign: 'left', cursor: full ? 'not-allowed' : 'pointer', fontFamily: 'inherit',
                  padding: '16px 18px', borderRadius: 14, opacity: full ? 0.45 : 1,
                  background: on ? 'rgba(199,36,255,0.14)' : 'rgba(255,255,255,0.03)',
                  border: '1px solid ' + (on ? 'var(--brand-2)' : 'var(--border-strong)'),
                }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap', marginBottom: 8 }}>
                  <span className="font-display" style={{ fontSize: 16.5, fontWeight: 800, color: '#fff' }}>{t.label}</span>
                  <span className="font-mono" style={{ fontSize: 10.5, letterSpacing: 1, color: 'var(--text-soft)', fontWeight: 700 }}>
                    {t.floor === 'ground' ? 'GROUND FLOOR' : 'SECOND FLOOR'}
                  </span>
                  {badge && (
                    <span style={{ fontSize: 10.5, fontWeight: 800, padding: '3px 9px', borderRadius: 999,
                      background: full ? 'var(--danger-bg)' : 'var(--warn-bg)',
                      color: full ? '#FF6B85' : '#FFD37A' }}>{badge}</span>
                  )}
                  <span className="font-headline" style={{ marginLeft: 'auto', fontSize: 23, fontWeight: 800, color: '#fff' }}>
                    {peso(t.package_price)}
                  </span>
                </div>
                <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', fontSize: 13, color: 'var(--text-muted)' }}>
                  <span>Seats {t.min_pax} to {t.max_pax}</span>
                  <span><strong style={{ color: '#fff' }}>{t.included_passes}</strong> entry passes</span>
                  <span><strong style={{ color: 'var(--accent)' }}>{peso(t.consumable)}</strong> consumable</span>
                </div>
              </button>
            );
          })}
        </div>
      </Card>

      <Card style={{ background: 'var(--warn-bg)', border: '1px dashed rgba(255,179,0,0.4)' }}>
        <div className="font-display" style={{ fontSize: 15, fontWeight: 800, color: '#FFD37A', marginBottom: 6 }}>
          Turning up on the night
        </div>
        <div style={{ fontSize: 13.5, color: '#FFD37A', lineHeight: 1.6 }}>
          Walk-in entry is {peso(WALKIN_PRICE)} at the door, complimentary drinks included. Door slots are limited and cannot be reserved here. Booking ahead saves you {peso(WALKIN_PRICE - PASS_PRICE)}.
        </div>
      </Card>

      <button disabled={!choice.kind} onClick={onNext}
        style={{
          width: '100%', padding: '16px', borderRadius: 14, border: 'none',
          fontFamily: 'inherit', fontSize: 15.5, fontWeight: 800, color: '#fff',
          cursor: choice.kind ? 'pointer' : 'not-allowed',
          background: choice.kind ? 'linear-gradient(90deg,#FF1B6B,#C724FF)' : 'rgba(255,255,255,0.06)',
        }}>
        Continue
      </button>
    </>
  );
}

// ---------- step 2: who is coming ----------

function GuestsStep({ choice, guests, setGuests, onBack, onNext, err }) {
  const table = choice.kind === 'table' ? choice.table : null;
  const maxGuests = table ? table.max_pax : 12;
  const included = table ? table.included_passes : 0;
  const extras = table ? Math.max(0, guests.length - included) : 0;

  const total = table
    ? Number(table.package_price) + extras * PASS_PRICE
    : guests.length * PASS_PRICE;

  const set = (i, k, v) => setGuests(guests.map((g, j) => (j === i ? Object.assign({}, g, { [k]: v }) : g)));

  return (
    <>
      <Card>
        <div className="font-display" style={{ fontSize: 19, fontWeight: 800, marginBottom: 6 }}>
          {table ? table.label : 'Entry passes'}
        </div>
        {table ? (
          <div style={{ fontSize: 14, color: 'var(--text-muted)', lineHeight: 1.65 }}>
            Your {peso(table.package_price)} covers <strong style={{ color: '#fff' }}>{included} entry passes</strong> and a <strong style={{ color: 'var(--accent)' }}>{peso(table.consumable)} consumable</strong> at the bar.
            {' '}The table seats up to {table.max_pax}. Bringing more than {included}? Each extra person is {peso(PASS_PRICE)}.
          </div>
        ) : (
          <div style={{ fontSize: 14, color: 'var(--text-muted)', lineHeight: 1.65 }}>
            {peso(PASS_PRICE)} per person, complimentary drinks included.
          </div>
        )}
      </Card>

      <Card>
        <div className="font-display" style={{ fontSize: 15.5, fontWeight: 800, marginBottom: 5 }}>Everyone in your party</div>
        <div style={{ fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 18 }}>
          We need a name, age and email for every guest. Each person receives their own entry QR by email, so the addresses must be different and correct. Everyone must be 18 or over and bring a physical ID.
        </div>

        {guests.map((g, i) => {
          const isExtra = table && i >= included;
          return (
            <div key={i} style={{
              padding: '14px 15px', borderRadius: 12, marginBottom: 10,
              background: isExtra ? 'rgba(255,179,0,0.07)' : 'rgba(255,255,255,0.02)',
              border: '1px solid ' + (isExtra ? 'rgba(255,179,0,0.3)' : 'var(--border)'),
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 11, flexWrap: 'wrap' }}>
                <span className="font-mono" style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-soft)', letterSpacing: 1 }}>
                  GUEST {i + 1}
                </span>
                {isExtra && (
                  <span style={{ fontSize: 10.5, fontWeight: 800, padding: '3px 9px', borderRadius: 999, background: 'var(--warn-bg)', color: '#FFD37A' }}>
                    EXTRA PASS +{peso(PASS_PRICE)}
                  </span>
                )}
                {guests.length > 1 && (
                  <button onClick={() => setGuests(guests.filter((_, j) => j !== i))}
                    style={{ marginLeft: 'auto', background: 'none', border: 'none', color: 'var(--text-soft)', cursor: 'pointer', fontSize: 12.5, fontFamily: 'inherit' }}>
                    Remove
                  </button>
                )}
              </div>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                <Field label="FULL NAME" value={g.name} onChange={(v) => set(i, 'name', v)} ph="As on their ID" w="1 1 200px" />
                <Field label="AGE" value={g.age} onChange={(v) => set(i, 'age', v.replace(/[^0-9]/g, '').slice(0, 2))} ph="18" w="0 0 90px" />
                <Field label="EMAIL" value={g.email} onChange={(v) => set(i, 'email', v)} ph="name@email.com" type="email" w="1 1 220px" />
              </div>
            </div>
          );
        })}

        {guests.length < maxGuests && (
          <button onClick={() => setGuests(guests.concat([{ name: '', age: '', email: '' }]))}
            style={{
              width: '100%', padding: '13px', borderRadius: 12, cursor: 'pointer', fontFamily: 'inherit',
              background: 'rgba(255,255,255,0.04)', border: '1px dashed var(--border-strong)',
              color: 'var(--text-muted)', fontSize: 14, fontWeight: 700,
            }}>
            + Add guest
            {table && guests.length >= included ? '  (extra pass, ' + peso(PASS_PRICE) + ')' : ''}
          </button>
        )}
        {guests.length >= maxGuests && (
          <div style={{ fontSize: 12.5, color: 'var(--text-soft)', textAlign: 'center', paddingTop: 6 }}>
            That is the maximum for this {table ? 'table' : 'booking'}.
          </div>
        )}
      </Card>

      <Card style={{ background: 'rgba(0,229,255,0.06)', border: '1px solid rgba(0,229,255,0.28)' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, marginBottom: 8 }}>
          <span style={{ fontSize: 14, color: 'var(--text-muted)' }}>
            {table ? table.label + ' package' : peso(PASS_PRICE) + ' \u00d7 ' + guests.length + ' passes'}
          </span>
          <span className="font-mono" style={{ fontSize: 14 }}>{peso(table ? table.package_price : guests.length * PASS_PRICE)}</span>
        </div>
        {extras > 0 && (
          <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, marginBottom: 8 }}>
            <span style={{ fontSize: 14, color: 'var(--text-muted)' }}>{extras} extra {extras === 1 ? 'pass' : 'passes'} \u00d7 {peso(PASS_PRICE)}</span>
            <span className="font-mono" style={{ fontSize: 14 }}>{peso(extras * PASS_PRICE)}</span>
          </div>
        )}
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, paddingTop: 10, borderTop: '1px solid rgba(0,229,255,0.25)' }}>
          <span className="font-display" style={{ fontSize: 16, fontWeight: 800 }}>Total to pay now</span>
          <span className="font-headline" style={{ fontSize: 24, fontWeight: 800, color: 'var(--accent)' }}>{peso(total)}</span>
        </div>
        {table && (
          <div style={{ fontSize: 12.5, color: 'var(--text-muted)', marginTop: 9, lineHeight: 1.55 }}>
            Includes the {peso(table.consumable)} consumable, which is yours to spend at the bar on the night.
          </div>
        )}
      </Card>

      {err && (
        <Card style={{ background: 'var(--danger-bg)', border: '1px solid rgba(255,23,68,0.4)' }}>
          <div style={{ fontSize: 13.5, color: '#FF6B85', lineHeight: 1.6 }}>{err}</div>
        </Card>
      )}

      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={onBack} style={{ flex: '0 0 auto', padding: '16px 22px', borderRadius: 14, cursor: 'pointer', fontFamily: 'inherit', background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border-strong)', color: 'var(--text-muted)', fontSize: 15, fontWeight: 700 }}>
          Back
        </button>
        <button onClick={onNext} style={{ flex: 1, padding: '16px', borderRadius: 14, border: 'none', fontFamily: 'inherit', fontSize: 15.5, fontWeight: 800, color: '#fff', cursor: 'pointer', background: 'linear-gradient(90deg,#FF1B6B,#C724FF)' }}>
          Continue to payment
        </button>
      </div>
    </>
  );
}

// ---------- step 3: pay ----------

function PayStep({ total, buyer, setBuyer, liability, setLiability, file, setFile, onBack, onSubmit, busy, err }) {
  const ready = buyer.name.trim() && buyer.email.trim() && buyer.phone.trim() && buyer.reference.trim() && file && liability;
  return (
    <>
      <Card>
        <div className="font-display" style={{ fontSize: 19, fontWeight: 800, marginBottom: 14 }}>Send {peso(total)} via GCash</div>
        <div style={{ padding: '18px 20px', borderRadius: 14, background: 'rgba(255,255,255,0.04)', border: '1px solid var(--border-strong)', marginBottom: 16 }}>
          <div className="font-mono" style={{ fontSize: 10.5, letterSpacing: 1.5, color: 'var(--text-soft)', fontWeight: 700, marginBottom: 6 }}>ACCOUNT NAME</div>
          <div className="font-display" style={{ fontSize: 18, fontWeight: 800, marginBottom: 14 }}>{GCASH_NAME}</div>
          <div className="font-mono" style={{ fontSize: 10.5, letterSpacing: 1.5, color: 'var(--text-soft)', fontWeight: 700, marginBottom: 6 }}>NUMBER</div>
          <div className="font-mono" style={{ fontSize: 20, fontWeight: 700, color: 'var(--accent)' }}>{GCASH_NUM}</div>
        </div>
        <div style={{ fontSize: 13.5, color: 'var(--text-muted)', lineHeight: 1.65 }}>
          Send the exact amount, then enter your reference number and upload the receipt below. We verify every payment by hand, usually within 24 hours.
        </div>
      </Card>

      <Card>
        <div className="font-display" style={{ fontSize: 15.5, fontWeight: 800, marginBottom: 14 }}>Your details</div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 12 }}>
          <Field label="YOUR NAME" value={buyer.name} onChange={(v) => setBuyer({ ...buyer, name: v })} ph="Full name" />
          <Field label="YOUR EMAIL" value={buyer.email} onChange={(v) => setBuyer({ ...buyer, email: v })} ph="name@email.com" type="email" />
          <Field label="MOBILE" value={buyer.phone} onChange={(v) => setBuyer({ ...buyer, phone: v })} ph="09XX XXX XXXX" />
          <Field label="GCASH REFERENCE" value={buyer.reference} onChange={(v) => setBuyer({ ...buyer, reference: v })} ph="From your receipt" />
        </div>
        <div className="font-mono" style={{ fontSize: 10, letterSpacing: 1.2, color: 'var(--text-soft)', fontWeight: 700, marginBottom: 6 }}>RECEIPT SCREENSHOT</div>
        <input type="file" accept="image/*" onChange={(e) => setFile(e.target.files && e.target.files[0])}
          style={{ width: '100%', padding: '11px 13px', borderRadius: 10, fontSize: 13.5, boxSizing: 'border-box' }} />

        <div style={{ marginTop: 16, paddingTop: 16, borderTop: '1px solid var(--border)' }}>
          <div className="font-mono" style={{ fontSize: 10, letterSpacing: 1.2, color: 'var(--text-soft)', fontWeight: 700, marginBottom: 6 }}>
            PROMOTER CODE <span style={{ color: 'var(--text-soft)', letterSpacing: 0 }}>(optional)</span>
          </div>
          <input value={buyer.promoter} onChange={(e) => setBuyer({ ...buyer, promoter: e.target.value.toUpperCase().slice(0, 24) })}
            placeholder="If someone referred you, enter their code"
            style={{ width: '100%', padding: '11px 13px', borderRadius: 10, fontSize: 14.5, boxSizing: 'border-box' }} />
          <div style={{ fontSize: 12, color: 'var(--text-soft)', marginTop: 6, lineHeight: 1.55 }}>
            Leave this blank if you do not have one. It does not change what you pay.
          </div>
        </div>
      </Card>

      <Card style={{ background: 'rgba(255,255,255,0.02)' }}>
        <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
          <input type="checkbox" checked={liability} onChange={(e) => setLiability(e.target.checked)}
            style={{ marginTop: 3, width: 18, height: 18, flexShrink: 0, accentColor: '#FF1B6B' }} />
          <span style={{ fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.65 }}>
            I confirm everyone in my party is 18 or over and will bring a physical ID. I understand entry is refused without one.
            Grand Encore is produced by UKD and hosted at The Pre Game Davao, and any matter arising at the venue is between those parties and the guest.
            Kreation Philippines acts solely as the ticketing provider.
            <strong style={{ color: '#fff' }}> Bookings are non-refundable and cannot be transferred.</strong>
          </span>
        </label>
      </Card>

      {err && (
        <Card style={{ background: 'var(--danger-bg)', border: '1px solid rgba(255,23,68,0.4)' }}>
          <div style={{ fontSize: 13.5, color: '#FF6B85', lineHeight: 1.6 }}>{err}</div>
        </Card>
      )}

      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={onBack} disabled={busy} style={{ flex: '0 0 auto', padding: '16px 22px', borderRadius: 14, cursor: 'pointer', fontFamily: 'inherit', background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border-strong)', color: 'var(--text-muted)', fontSize: 15, fontWeight: 700 }}>
          Back
        </button>
        <button onClick={onSubmit} disabled={!ready || busy}
          style={{
            flex: 1, padding: '16px', borderRadius: 14, border: 'none', fontFamily: 'inherit',
            fontSize: 15.5, fontWeight: 800, color: '#fff',
            cursor: (ready && !busy) ? 'pointer' : 'not-allowed',
            background: (ready && !busy) ? 'linear-gradient(90deg,#FF1B6B,#C724FF)' : 'rgba(255,255,255,0.06)',
          }}>
          {busy ? 'Submitting...' : 'Submit booking'}
        </button>
      </div>
    </>
  );
}

// ---------- step 4: done ----------

function DoneStep({ result }) {
  return (
    <Card style={{ textAlign: 'center', padding: '38px 24px' }}>
      <div className="font-headline" style={{ fontSize: 26, fontWeight: 800, marginBottom: 12 }}>Booking received</div>
      <div style={{ fontSize: 14.5, color: 'var(--text-muted)', lineHeight: 1.65, marginBottom: 22 }}>
        We are checking your payment now. Once it clears, every guest receives their own entry QR by email.
      </div>
      <div style={{ display: 'inline-block', padding: '14px 26px', borderRadius: 14, background: 'rgba(0,229,255,0.1)', border: '1px solid rgba(0,229,255,0.35)', marginBottom: 22 }}>
        <div className="font-mono" style={{ fontSize: 10.5, letterSpacing: 1.5, color: 'var(--text-soft)', fontWeight: 700, marginBottom: 5 }}>REFERENCE</div>
        <div className="font-mono" style={{ fontSize: 22, fontWeight: 700, color: 'var(--accent)' }}>{result.reservation_code}</div>
      </div>
      <div style={{ fontSize: 13.5, color: 'var(--text-muted)', lineHeight: 1.7 }}>
        Keep this reference. Bring a physical ID on the night, strictly 18 and over.<br />
        Doors from 9:00 PM at The Pre Game Davao.
      </div>
    </Card>
  );
}

// ---------- app ----------

function App() {
  const [loading, setLoading] = useState(true);
  const [avail, setAvail] = useState([]);
  const [loadErr, setLoadErr] = useState('');
  const [step, setStep] = useState('choose');
  const [choice, setChoice] = useState({});
  const [guests, setGuests] = useState([{ name: '', age: '', email: '' }]);
  const [buyer, setBuyer] = useState({ name: '', email: '', phone: '', reference: '', promoter: '' });
  const [liability, setLiability] = useState(false);
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [result, setResult] = useState(null);

  const closed = new Date() > CUTOFF;

  useEffect(() => {
    (async () => {
      try {
        const r = await supabase.rpc('after_party_table_availability');
        if (!r.error && Array.isArray(r.data)) setAvail(r.data);
        else console.warn('[availability]', r.error && r.error.message);
      } catch (e) {
        setLoadErr('Could not load table availability. Please refresh.');
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const table = choice.kind === 'table' ? choice.table : null;
  const extras = table ? Math.max(0, guests.length - table.included_passes) : 0;
  const total = table
    ? Number(table.package_price) + extras * PASS_PRICE
    : guests.length * PASS_PRICE;

  const validateGuests = () => {
    for (let i = 0; i < guests.length; i++) {
      const g = guests[i];
      if (!g.name.trim()) return 'Guest ' + (i + 1) + ' needs a name.';
      const age = parseInt(g.age, 10);
      if (!age) return 'Guest ' + (i + 1) + ' needs an age.';
      if (age < 18) return 'Guest ' + (i + 1) + ' is under 18. This event is strictly 18 and over.';
      const em = g.email.trim().toLowerCase();
      if (!em || em.indexOf('@') < 1) return 'Guest ' + (i + 1) + ' needs a valid email. Each guest gets their own entry QR.';
    }
    const emails = guests.map((g) => g.email.trim().toLowerCase());
    if (new Set(emails).size !== emails.length) return 'Each guest needs a different email address.';
    return '';
  };

  const submit = async () => {
    setErr(''); setBusy(true);
    try {
      const path = 'afterparty/' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) +
        '.' + (file.name.split('.').pop() || 'jpg');
      const up = await supabase.storage.from('receipts').upload(path, file, { upsert: false });
      if (up.error) throw new Error('Receipt upload failed: ' + up.error.message);

      let tableId = null;
      if (table) {
        const pick = await supabase.rpc('after_party_pick_table', {
          p_table_type: table.table_type, p_floor: table.floor,
        });
        if (pick.error) throw new Error(pick.error.message);
        tableId = pick.data;
        if (!tableId) throw new Error('That table type just sold out. Please choose another.');
      }

      const rpc = await supabase.rpc('create_grand_encore_reservation', {
        p_table_id: tableId,
        p_buyer_name: buyer.name,
        p_buyer_email: buyer.email,
        p_buyer_phone: buyer.phone,
        p_reference: buyer.reference,
        p_receipt_path: path,
        p_liability: liability,
        p_guests: guests.map((g) => ({ name: g.name.trim(), age: parseInt(g.age, 10), email: g.email.trim().toLowerCase() })),
        p_promoter_code: buyer.promoter.trim() || null,
      });
      if (rpc.error) throw new Error(rpc.error.message);

      setResult(rpc.data);
      setStep('done');
      window.scrollTo(0, 0);
    } catch (e) {
      setErr(e.message || 'Something went wrong. Please try again.');
    } finally {
      setBusy(false);
    }
  };

  if (loading) {
    return <Shell><div style={{ textAlign: 'center', padding: 70, color: 'var(--text-soft)' }}>Loading...</div></Shell>;
  }

  if (closed) {
    return (
      <Shell>
        <Header />
        <Card style={{ background: 'var(--warn-bg)', border: '1px dashed rgba(255,179,0,0.4)', textAlign: 'center', padding: '34px 24px' }}>
          <div className="font-display" style={{ fontSize: 20, fontWeight: 800, color: '#FFD37A', marginBottom: 10 }}>
            Online booking has closed
          </div>
          <div style={{ fontSize: 14.5, color: '#FFD37A', lineHeight: 1.7 }}>
            Pre-registration ended on 20 August. You can still come on the night: walk-in entry is {peso(WALKIN_PRICE)} at the door, complimentary drinks included.<br /><br />
            Doors from 9:00 PM at The Pre Game Davao. Strictly 18 and over, physical ID required.
          </div>
        </Card>
      </Shell>
    );
  }

  return (
    <Shell>
      <Header />
      {loadErr && (
        <Card style={{ background: 'var(--danger-bg)', border: '1px solid rgba(255,23,68,0.4)' }}>
          <div style={{ fontSize: 13.5, color: '#FF6B85' }}>{loadErr}</div>
        </Card>
      )}

      {step === 'choose' && (
        <ChooseStep avail={avail} choice={choice} setChoice={setChoice}
          onNext={() => {
            const t = choice.kind === 'table' ? choice.table : null;
            setGuests(t
              ? Array.from({ length: t.included_passes }, () => ({ name: '', age: '', email: '' }))
              : [{ name: '', age: '', email: '' }]);
            setErr('');
            setStep('guests');
            window.scrollTo(0, 0);
          }} />
      )}

      {step === 'guests' && (
        <GuestsStep choice={choice} guests={guests} setGuests={setGuests} err={err}
          onBack={() => { setErr(''); setStep('choose'); window.scrollTo(0, 0); }}
          onNext={() => {
            const v = validateGuests();
            if (v) { setErr(v); return; }
            setErr(''); setStep('pay'); window.scrollTo(0, 0);
          }} />
      )}

      {step === 'pay' && (
        <PayStep total={total} buyer={buyer} setBuyer={setBuyer} liability={liability} setLiability={setLiability}
          file={file} setFile={setFile} busy={busy} err={err}
          onBack={() => { setErr(''); setStep('guests'); window.scrollTo(0, 0); }}
          onSubmit={submit} />
      )}

      {step === 'done' && result && <DoneStep result={result} />}

      <div style={{ textAlign: 'center', fontSize: 11.5, color: 'var(--text-soft)', marginTop: 28, lineHeight: 1.7 }}>
        Grand Encore is produced by UKD, hosted at The Pre Game Davao.<br />
        Ticketing by Kreation Philippines &nbsp;·&nbsp; kreationph@gmail.com
      </div>
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
