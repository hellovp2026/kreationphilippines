<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DKC 2026 After-Party · The Pre Game Davao</title>
<meta name="description" content="Reserve your entry and tables for the official Davao K-Pop Convention 2026 after-party at The Pre Game Davao." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Unbounded:wght@700;800&family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #08020F;
    --bg-soft: #150929;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-elev: #251142;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #FFFFFF;
    --text-muted: #B8A8D0;
    --text-soft: #7A6890;
    --brand: #FF1B6B;
    --brand-2: #C724FF;
    --accent: #00E5FF;
    --success: #00E676;
    --warn: #FFB300;
    --danger: #FF1744;
    --success-bg: rgba(0, 230, 118, 0.12);
    --warn-bg: rgba(255, 179, 0, 0.14);
    --danger-bg: rgba(255, 23, 68, 0.14);
    --cyan-bg: rgba(0, 229, 255, 0.12);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .font-display { font-family: 'Sora', ui-sans-serif; letter-spacing: -0.4px; }
  .font-headline { font-family: 'Unbounded', 'Sora', ui-sans-serif; letter-spacing: -0.5px; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(120px);
    pointer-events: none; z-index: 0;
  }
  input, select { font-family: inherit; background: rgba(255,255,255,0.03); color: var(--text); border: 1px solid var(--border-strong); outline: none; }
  input:focus, select:focus { border-color: var(--brand); }
  ::placeholder { color: var(--text-soft); }
  .spin { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const SUPABASE_URL = 'https://zxichjnifawondqqbrxn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_298EyDyzguh8YMyzPPJeaA_glbUxJfH';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- pricing constants ----
const ENTRY_REGULAR = 450;   // includes a drink
const ENTRY_DISCOUNTED = 300; // table min-pax only, no drink
const ENTRY_WALKIN = 500;    // night-only, POS; shown as info here
const PREGAME_CUT = 150;     // flat, every entry type

const peso = (n) => '\u20b1' + Number(n || 0).toLocaleString('en-PH');

const TYPE_LABEL = {
  standing: 'Standing Table',
  chairs: 'Table with Chairs',
  vip_couch: 'VIP Couch',
  vip_table: 'VIP Table',
  vip_high: 'VIP High Table',
  vip_mega: 'VIP Mega Couch',
};

function genResCode() {
  const s = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let out = 'AP-';
  for (let i = 0; i < 8; i++) out += s[Math.floor(Math.random() * s.length)];
  return out;
}

function Spinner({ size = 16, color = 'var(--brand)' }) {
  return (
    <span className="spin" style={{
      display: 'inline-block', width: size, height: size,
      border: '2px solid rgba(255,255,255,0.25)', borderTopColor: color,
      borderRadius: '50%',
    }} />
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState(null);
  const [event, setEvent] = useState(null);
  const [tables, setTables] = useState([]);
  const [step, setStep] = useState('build'); // build | pay | done
  const [doneCode, setDoneCode] = useState(null);

  // cart
  const [regQty, setRegQty] = useState(0);   // standalone regular entries (no table)
  const [tableId, setTableId] = useState(null);
  const [extraQty, setExtraQty] = useState(0); // guests beyond min_pax at the table, at regular price
  const [sessionTakenTables, setSessionTakenTables] = useState(new Set());

  useEffect(() => {
    (async () => {
      try {
        const [evR, tR] = await Promise.all([
          supabase.from('events').select('*').eq('is_active', true).limit(1).maybeSingle(),
          supabase.from('after_party_tables').select('*').eq('is_active', true).order('display_order'),
        ]);
        if (evR.error) throw evR.error;
        if (tR.error) throw tR.error;
        setEvent(evR.data);
        setTables(tR.data || []);
      } catch (e) {
        setLoadErr(e.message || 'Failed to load');
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const chosenTable = useMemo(
    () => tables.find((t) => t.id === tableId) || null,
    [tables, tableId]
  );

  if (loading) {
    return <Centered><Spinner size={26} /></Centered>;
  }
  if (loadErr) {
    return <Centered><div style={{ color: 'var(--warn)', textAlign: 'center' }}>Could not load the after-party page.<br />{loadErr}</div></Centered>;
  }

  return (
    <div style={{ position: 'relative', minHeight: '100vh', overflow: 'hidden' }}>
      <div className="blob" style={{ width: 500, height: 500, background: 'radial-gradient(circle, rgba(255,27,107,0.28), transparent 70%)', top: -250, left: -150 }} />
      <div className="blob" style={{ width: 480, height: 480, background: 'radial-gradient(circle, rgba(0,229,255,0.16), transparent 70%)', bottom: -220, right: -140 }} />
      <div style={{ position: 'relative', zIndex: 1, maxWidth: 780, margin: '0 auto', padding: '28px 18px 80px' }}>
        <Header />
        {step === 'build' && (
          <BuildStep
            tables={tables}
            regQty={regQty} setRegQty={setRegQty}
            tableId={tableId} setTableId={setTableId}
            extraQty={extraQty} setExtraQty={setExtraQty}
            chosenTable={chosenTable}
            sessionTakenTables={sessionTakenTables}
            setSessionTakenTables={setSessionTakenTables}
            onProceed={() => setStep('pay')}
          />
        )}
        {step === 'pay' && (
          <PayStep
            event={event}
            chosenTable={chosenTable}
            regQty={regQty}
            extraQty={extraQty}
            onBack={() => setStep('build')}
            onDone={(code) => { setDoneCode(code); setStep('done'); }}
          />
        )}
        {step === 'done' && <DoneStep code={doneCode} />}
      </div>
    </div>
  );
}

function Centered({ children }) {
  return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>{children}</div>;
}

function Header() {
  return (
    <div style={{ marginBottom: 26 }}>
      <div style={{ fontSize: 11, letterSpacing: 2.5, color: 'var(--accent)', fontWeight: 700, marginBottom: 10 }}>
        OFFICIAL AFTER-PARTY · THE PRE GAME DAVAO
      </div>
      <h1 className="font-headline" style={{ fontSize: 'clamp(26px, 5vw, 40px)', lineHeight: 1.1, margin: 0, fontWeight: 800 }}>
        Keep the night going at the <span style={{ color: 'var(--brand)' }}>after-party.</span>
      </h1>
      <p style={{ color: 'var(--text-muted)', lineHeight: 1.6, marginTop: 14, fontSize: 15 }}>
        After the convention wraps, the party moves to The Pre Game Davao. Grab your entry, or lock in a table with your group. Tables are limited and go first come, first served, so reserve early.
      </p>
    </div>
  );
}

// ============================================================
// BUILD STEP
// ============================================================
function BuildStep({
  tables, regQty, setRegQty, tableId, setTableId,
  extraQty, setExtraQty, chosenTable, sessionTakenTables, setSessionTakenTables, onProceed,
}) {
  const [checking, setChecking] = useState(false);
  const [toast, setToast] = useState('');

  const showToast = (m) => { setToast(m); setTimeout(() => setToast(''), 2400); };

  const checkTable = async (id) => {
    try {
      const res = await supabase.rpc('tables_taken', { p_table_ids: [id] });
      if (res.error) { console.warn('table check', res.error.message); return []; }
      return Array.isArray(res.data) ? res.data : [];
    } catch (e) { console.warn(e); return []; }
  };

  const pickTable = async (t) => {
    if (sessionTakenTables.has(t.id)) { showToast('That table is already taken. Please pick another.'); return; }
    if (tableId === t.id) { setTableId(null); setExtraQty(0); return; }
    setTableId(t.id);
    setExtraQty(0);
    const taken = await checkTable(t.id);
    if (taken.includes(t.id)) {
      setTableId(null);
      setSessionTakenTables((prev) => new Set(prev).add(t.id));
      showToast('That table was just taken. Please pick another.');
    }
  };

  const grouped = useMemo(() => {
    const g = { ground: [], second: [] };
    tables.forEach((t) => { (g[t.floor] || (g[t.floor] = [])).push(t); });
    return g;
  }, [tables]);

  // Totals
  const tableEntries = chosenTable ? chosenTable.min_pax : 0;
  const discountedTotal = tableEntries * ENTRY_DISCOUNTED;
  const extraTotal = extraQty * ENTRY_REGULAR;
  const regularTotal = regQty * ENTRY_REGULAR;
  const entryTotal = discountedTotal + extraTotal + regularTotal;
  const tableSpend = chosenTable ? Number(chosenTable.min_spend) : 0;
  const grand = entryTotal + tableSpend;
  const totalGuests = tableEntries + extraQty + regQty;
  const canProceed = totalGuests > 0;

  const proceed = async () => {
    // Final re-check of the chosen table before payment.
    if (chosenTable) {
      setChecking(true);
      const taken = await checkTable(chosenTable.id);
      setChecking(false);
      if (taken.includes(chosenTable.id)) {
        setTableId(null);
        setSessionTakenTables((prev) => new Set(prev).add(chosenTable.id));
        showToast('That table was just taken. Please pick another.');
        return;
      }
    }
    onProceed();
  };

  return (
    <div>
      {/* ENTRY TIERS */}
      <SectionCard>
        <SectionTitle>1 · Entry</SectionTitle>
        <p style={{ fontSize: 13, color: 'var(--text-soft)', marginTop: -4, marginBottom: 16 }}>
          Regular entry includes one drink. The discounted rate applies only to the minimum guests on a reserved table.
        </p>

        <TierRow
          name="Regular Entry"
          price={ENTRY_REGULAR}
          note="Includes 1 drink"
          qty={regQty}
          onDec={() => setRegQty(Math.max(0, regQty - 1))}
          onInc={() => setRegQty(regQty + 1)}
        />

        <div style={{
          marginTop: 12, padding: '11px 14px', borderRadius: 10,
          background: 'var(--warn-bg)', border: '1px solid rgba(255,179,0,0.3)',
          fontSize: 12.5, color: '#FFD37A', lineHeight: 1.5,
        }}>
          Walk-in entry on the night is {peso(ENTRY_WALKIN)} (includes 1 drink), and door slots are limited. Buying online saves you {peso(ENTRY_WALKIN - ENTRY_REGULAR)} and guarantees entry.
        </div>

        <div style={{
          marginTop: 12, padding: '11px 14px', borderRadius: 10,
          background: 'var(--cyan-bg)', border: '1px solid rgba(0,229,255,0.28)',
          fontSize: 12.5, color: '#9BEAFF', lineHeight: 1.5,
        }}>
          Reserve a table below and the first {chosenTable ? chosenTable.min_pax : 'few'} guests on it pay only {peso(ENTRY_DISCOUNTED)} entry each (no drink included).
        </div>
      </SectionCard>

      {/* TABLES */}
      <SectionCard>
        <SectionTitle>2 · Tables <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--warn)' }}>· limited, selling fast</span></SectionTitle>
        <p style={{ fontSize: 13, color: 'var(--text-soft)', marginTop: -4, marginBottom: 8 }}>
          The amount shown is the table's minimum spend, consumable on food, drinks, and more at the bar. It is paid to The Pre Game Davao. First buyers are served first.
        </p>

        {['ground', 'second'].map((floor) => (
          <div key={floor} style={{ marginTop: 16 }}>
            <div style={{ fontSize: 11, letterSpacing: 1.5, color: 'var(--text-muted)', fontWeight: 700, marginBottom: 10 }}>
              {floor === 'ground' ? 'GROUND FLOOR' : 'SECOND FLOOR'}
            </div>
            <div style={{ display: 'grid', gap: 8 }}>
              {(grouped[floor] || []).map((t) => {
                const isSel = tableId === t.id;
                const isGone = sessionTakenTables.has(t.id);
                return (
                  <button key={t.id} disabled={isGone} onClick={() => pickTable(t)}
                    style={{
                      textAlign: 'left', cursor: isGone ? 'not-allowed' : 'pointer',
                      padding: '12px 14px', borderRadius: 12,
                      background: isSel ? 'rgba(255,27,107,0.12)' : 'rgba(255,255,255,0.02)',
                      border: '1px solid ' + (isSel ? 'var(--brand)' : 'var(--border)'),
                      opacity: isGone ? 0.4 : 1,
                      display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10,
                    }}>
                    <div>
                      <div style={{ fontSize: 14.5, fontWeight: 700 }}>
                        {t.label} {isGone && <span style={{ fontSize: 11, color: 'var(--warn)' }}>· taken</span>}
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--text-soft)', marginTop: 2 }}>
                        Good for {t.min_pax} pax {'\u00b7'} {peso(ENTRY_DISCOUNTED)} entry each
                      </div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div className="font-display" style={{ fontSize: 16, fontWeight: 800, color: isSel ? 'var(--brand)' : 'var(--text)' }}>
                        {peso(t.min_spend)}
                      </div>
                      <div style={{ fontSize: 10.5, color: 'var(--text-soft)' }}>min spend</div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        ))}

        {/* Extra guests beyond min pax */}
        {chosenTable && (
          <div style={{ marginTop: 18, padding: '14px 16px', borderRadius: 12, background: 'rgba(255,255,255,0.02)', border: '1px solid var(--border)' }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 4 }}>
              {chosenTable.label} reserved
            </div>
            <div style={{ fontSize: 12.5, color: 'var(--text-soft)', marginBottom: 12, lineHeight: 1.5 }}>
              {chosenTable.min_pax} guests at {peso(ENTRY_DISCOUNTED)} each are included. Bringing more? Extra guests pay the regular {peso(ENTRY_REGULAR)} entry (with drink).
            </div>
            <TierRow
              name="Extra guests"
              price={ENTRY_REGULAR}
              note={'Beyond the ' + chosenTable.min_pax + ' included'}
              qty={extraQty}
              onDec={() => setExtraQty(Math.max(0, extraQty - 1))}
              onInc={() => setExtraQty(extraQty + 1)}
            />
            {extraQty > 0 && (
              <div style={{ marginTop: 10, fontSize: 12, color: 'var(--warn)', lineHeight: 1.5 }}>
                {extraQty} extra guest{extraQty === 1 ? '' : 's'} added at {peso(ENTRY_REGULAR)} each. Only the first {chosenTable.min_pax} on this table qualify for the {peso(ENTRY_DISCOUNTED)} rate.
              </div>
            )}
          </div>
        )}
      </SectionCard>

      {/* SUMMARY */}
      <SectionCard>
        <SectionTitle>Your total</SectionTitle>
        {totalGuests === 0 ? (
          <div style={{ fontSize: 13, color: 'var(--text-soft)' }}>Add entry or reserve a table to continue.</div>
        ) : (
          <div style={{ fontSize: 13.5, display: 'grid', gap: 7 }}>
            {chosenTable && <SumRow label={chosenTable.min_pax + ' table entries @ ' + peso(ENTRY_DISCOUNTED)} value={peso(discountedTotal)} />}
            {extraQty > 0 && <SumRow label={extraQty + ' extra @ ' + peso(ENTRY_REGULAR)} value={peso(extraTotal)} />}
            {regQty > 0 && <SumRow label={regQty + ' regular @ ' + peso(ENTRY_REGULAR)} value={peso(regularTotal)} />}
            <div style={{ borderTop: '1px solid var(--border)', margin: '4px 0' }} />
            <SumRow label="Entry subtotal (paid to Kreation)" value={peso(entryTotal)} />
            {chosenTable && <SumRow label="Table min spend (paid to Pre Game)" value={peso(tableSpend)} />}
            <div style={{ borderTop: '1px solid var(--border)', margin: '4px 0' }} />
            <SumRow label="Grand total" value={peso(grand)} big />
          </div>
        )}
        {toast && (
          <div style={{ marginTop: 14, padding: '10px 14px', borderRadius: 10, background: 'var(--warn-bg)', border: '1px solid rgba(255,179,0,0.35)', color: '#FFD37A', fontSize: 12.5 }}>
            {toast}
          </div>
        )}
        <button disabled={!canProceed || checking} onClick={proceed}
          style={{
            marginTop: 18, width: '100%', padding: '14px', borderRadius: 12, border: 'none',
            background: canProceed ? 'linear-gradient(90deg, #FF1B6B, #C724FF)' : 'rgba(255,255,255,0.06)',
            color: '#fff', fontWeight: 700, fontSize: 15, cursor: canProceed ? 'pointer' : 'not-allowed',
            fontFamily: 'inherit',
          }}>
          {checking ? 'Checking table...' : 'Continue to details \u2192'}
        </button>
      </SectionCard>
    </div>
  );
}

function TierRow({ name, price, note, qty, onDec, onInc }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, padding: '10px 0' }}>
      <div>
        <div style={{ fontSize: 14.5, fontWeight: 700 }}>{name}</div>
        <div style={{ fontSize: 12, color: 'var(--text-soft)', marginTop: 2 }}>{peso(price)} {'\u00b7'} {note}</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <QtyBtn onClick={onDec}>{'\u2212'}</QtyBtn>
        <span className="font-mono" style={{ minWidth: 20, textAlign: 'center', fontSize: 16, fontWeight: 700 }}>{qty}</span>
        <QtyBtn onClick={onInc}>+</QtyBtn>
      </div>
    </div>
  );
}

function QtyBtn({ children, onClick }) {
  return (
    <button onClick={onClick} style={{
      width: 34, height: 34, borderRadius: 9, cursor: 'pointer',
      background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border-strong)',
      color: 'var(--text)', fontSize: 18, fontWeight: 700, lineHeight: 1, fontFamily: 'inherit',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>{children}</button>
  );
}

function SumRow({ label, value, big }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
      <span style={{ color: big ? 'var(--text)' : 'var(--text-muted)', fontWeight: big ? 800 : 500, fontSize: big ? 16 : 13.5 }}>{label}</span>
      <span className="font-display" style={{ color: big ? 'var(--brand)' : 'var(--text)', fontWeight: big ? 800 : 600, fontSize: big ? 18 : 13.5 }}>{value}</span>
    </div>
  );
}

function SectionCard({ children }) {
  return (
    <div style={{
      background: 'var(--surface)', borderRadius: 16, border: '1px solid var(--border)',
      padding: '18px 18px', marginBottom: 16,
    }}>{children}</div>
  );
}

function SectionTitle({ children }) {
  return <div className="font-display" style={{ fontSize: 15, fontWeight: 800, marginBottom: 12 }}>{children}</div>;
}

// ============================================================
// PAY STEP
// ============================================================
function PayStep({ event, chosenTable, regQty, extraQty, onBack, onDone }) {
  const [buyerName, setBuyerName] = useState('');
  const [buyerEmail, setBuyerEmail] = useState('');
  const [buyerPhone, setBuyerPhone] = useState('');

  // Guest rows: table min-pax discounted + extras + standalone regular.
  const guestSlots = useMemo(() => {
    const slots = [];
    if (chosenTable) {
      for (let i = 0; i < chosenTable.min_pax; i++) slots.push({ kind: 'discounted' });
      for (let i = 0; i < extraQty; i++) slots.push({ kind: 'regular' });
    }
    for (let i = 0; i < regQty; i++) slots.push({ kind: 'regular' });
    return slots;
  }, [chosenTable, extraQty, regQty]);

  const [guests, setGuests] = useState(() => guestSlots.map(() => ({ name: '', email: '', phone: '', age: '' })));

  const [entryRef, setEntryRef] = useState('');
  const [entryReceipt, setEntryReceipt] = useState(null);
  const [tableRef, setTableRef] = useState('');
  const [tableReceipt, setTableReceipt] = useState(null);
  const [liability, setLiability] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);

  const entryRef_input = useRef(null);
  const tableRef_input = useRef(null);

  const gcash = (event && event.payment_instructions && event.payment_instructions.gcash) || {};

  // Money
  const discountedTotal = chosenTable ? chosenTable.min_pax * ENTRY_DISCOUNTED : 0;
  const extraTotal = extraQty * ENTRY_REGULAR;
  const regularTotal = regQty * ENTRY_REGULAR;
  const entryTotal = discountedTotal + extraTotal + regularTotal;
  const tableSpend = chosenTable ? Number(chosenTable.min_spend) : 0;
  const entryCount = guestSlots.length;
  const entryPregameCut = entryCount * PREGAME_CUT;
  const entryKreationShare = entryTotal - entryPregameCut;

  const setGuest = (i, field, val) => {
    setGuests((prev) => prev.map((g, idx) => idx === i ? Object.assign({}, g, { [field]: val }) : g));
  };

  const validate = () => {
    if (!buyerName.trim()) return 'Please enter the lead booker name.';
    if (!buyerEmail.trim() || buyerEmail.indexOf('@') < 0) return 'Please enter a valid email.';
    if (!buyerPhone.trim()) return 'Please enter a contact number.';
    for (let i = 0; i < guests.length; i++) {
      const g = guests[i];
      if (!g.name.trim()) return 'Please enter a name for guest ' + (i + 1) + '.';
      const age = parseInt(g.age, 10);
      if (!age || isNaN(age)) return 'Please enter the age for guest ' + (i + 1) + '.';
      if (age < 18) return 'Guest ' + (i + 1) + ' must be 18 or older. This is an 18+ event.';
    }
    if (entryRef.trim().length < 4) return 'Please enter your GCash reference number for entry.';
    if (!entryReceipt) return 'Please upload your entry payment receipt.';
    if (chosenTable) {
      if (tableRef.trim().length < 4) return 'Please enter the reference number for your table payment.';
      if (!tableReceipt) return 'Please upload your table payment receipt.';
    }
    if (!liability) return 'Please tick the acknowledgment to continue.';
    return null;
  };

  const uploadReceipt = async (file, prefix) => {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = 'afterparty/' + prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const up = await supabase.storage.from('receipts').upload(path, file, { upsert: false });
    if (up.error) throw new Error('Receipt upload failed: ' + up.error.message);
    return path;
  };

  const submit = async () => {
    const v = validate();
    if (v) { setErr(v); return; }
    setErr(null);
    setSubmitting(true);
    try {
      // Re-check the table one last time before creating anything.
      if (chosenTable) {
        const chk = await supabase.rpc('tables_taken', { p_table_ids: [chosenTable.id] });
        if (!chk.error && Array.isArray(chk.data) && chk.data.includes(chosenTable.id)) {
          throw new Error('That table was just taken by someone else. Please go back and choose another.');
        }
      }

      const entryReceiptPath = await uploadReceipt(entryReceipt, 'entry');
      let tableReceiptPath = null;
      if (chosenTable) tableReceiptPath = await uploadReceipt(tableReceipt, 'table');

      const code = genResCode();
      const resIns = await supabase.from('after_party_reservations').insert({
        reservation_code: code,
        order_id: null,
        table_id: chosenTable ? chosenTable.id : null,
        buyer_name: buyerName.trim(),
        buyer_email: buyerEmail.trim(),
        buyer_phone: buyerPhone.trim(),
        entry_total: entryTotal,
        entry_kreation_share: entryKreationShare,
        entry_pregame_cut: entryPregameCut,
        table_min_spend: tableSpend,
        grand_total: entryTotal + tableSpend,
        entry_reference: entryRef.trim(),
        entry_receipt_path: entryReceiptPath,
        table_reference: chosenTable ? tableRef.trim() : null,
        table_receipt_path: tableReceiptPath,
        status: 'awaiting_verification',
        source: 'online',
        liability_agreed: true,
        liability_agreed_at: new Date().toISOString(),
      }).select('id, reservation_code').single();

      if (resIns.error) throw new Error(resIns.error.message);
      const resId = resIns.data.id;

      // Guest entry rows
      const entryRows = guestSlots.map((slot, i) => {
        const g = guests[i];
        const isDisc = slot.kind === 'discounted';
        const price = isDisc ? ENTRY_DISCOUNTED : ENTRY_REGULAR;
        return {
          reservation_id: resId,
          guest_name: g.name.trim(),
          guest_email: g.email.trim() || null,
          guest_phone: g.phone.trim() || null,
          guest_age: parseInt(g.age, 10),
          entry_type: isDisc ? 'discounted' : 'regular',
          price: price,
          pregame_cut: PREGAME_CUT,
          kreation_share: price - PREGAME_CUT,
          includes_drink: !isDisc,
          on_table: isDisc,
          guest_order: i + 1,
        };
      });
      const entIns = await supabase.from('after_party_entries').insert(entryRows);
      if (entIns.error) throw new Error(entIns.error.message);

      onDone(resIns.data.reservation_code);
    } catch (e) {
      setErr(e.message || 'Something went wrong. Please try again.');
      setSubmitting(false);
    }
  };

  return (
    <div>
      <SectionCard>
        <SectionTitle>Lead booker</SectionTitle>
        <Field label="FULL NAME" value={buyerName} onChange={setBuyerName} placeholder="Your name" />
        <Field label="EMAIL" value={buyerEmail} onChange={setBuyerEmail} placeholder="you@email.com" type="email" />
        <Field label="CONTACT NUMBER" value={buyerPhone} onChange={setBuyerPhone} placeholder="+63 9XX XXX XXXX" />
      </SectionCard>

      <SectionCard>
        <SectionTitle>Guests <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-soft)' }}>· {entryCount} total · 18+ only</span></SectionTitle>
        {guests.map((g, i) => {
          const slot = guestSlots[i];
          return (
            <div key={i} style={{ padding: '12px 0', borderBottom: i < guests.length - 1 ? '1px solid var(--border)' : 'none' }}>
              <div style={{ fontSize: 12, color: 'var(--text-soft)', marginBottom: 8 }}>
                Guest {i + 1} {'\u00b7'} {slot.kind === 'discounted' ? peso(ENTRY_DISCOUNTED) + ' table entry (no drink)' : peso(ENTRY_REGULAR) + ' regular (with drink)'}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 90px', gap: 8, marginBottom: 8 }}>
                <input value={g.name} onChange={(e) => setGuest(i, 'name', e.target.value)} placeholder="Full name"
                  style={{ padding: '10px 12px', borderRadius: 9, fontSize: 14 }} />
                <input value={g.age} onChange={(e) => setGuest(i, 'age', e.target.value.replace(/[^0-9]/g, ''))} placeholder="Age" inputMode="numeric"
                  style={{ padding: '10px 12px', borderRadius: 9, fontSize: 14 }} />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                <input value={g.email} onChange={(e) => setGuest(i, 'email', e.target.value)} placeholder="Email (optional)"
                  style={{ padding: '10px 12px', borderRadius: 9, fontSize: 14 }} />
                <input value={g.phone} onChange={(e) => setGuest(i, 'phone', e.target.value)} placeholder="Phone (optional)"
                  style={{ padding: '10px 12px', borderRadius: 9, fontSize: 14 }} />
              </div>
            </div>
          );
        })}
      </SectionCard>

      {/* ENTRY PAYMENT (to Kreation GCash) */}
      <SectionCard>
        <SectionTitle>Entry payment {'\u2192'} Kreation GCash</SectionTitle>
        <div style={{
          padding: 16, borderRadius: 12, marginBottom: 16,
          background: 'linear-gradient(135deg, rgba(0,124,240,0.18), rgba(0,196,255,0.08))',
          border: '1px solid rgba(0,196,255,0.3)',
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10, flexWrap: 'wrap', gap: 4 }}>
            <div className="font-display" style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, color: 'var(--accent)' }}>SEND VIA GCASH</div>
            <div className="font-display" style={{ fontSize: 24, fontWeight: 800 }}>{peso(entryTotal)}</div>
          </div>
          <PayLine label="ACCOUNT NAME" value={gcash.account_name || 'Kyla Don'} />
          <PayLine label="NUMBER" value={gcash.account_number || '09534900227'} mono />
        </div>
        <Field label="GCASH REFERENCE NUMBER" value={entryRef} onChange={setEntryRef} placeholder="e.g. 1234567890" mono />
        <ReceiptUpload file={entryReceipt} setFile={setEntryReceipt} inputRef={entryRef_input} label="ENTRY RECEIPT SCREENSHOT" />
      </SectionCard>

      {/* TABLE PAYMENT (to Pre Game QR) - only when a table is chosen */}
      {chosenTable && (
        <SectionCard>
          <SectionTitle>Table payment {'\u2192'} The Pre Game Davao</SectionTitle>
          <div style={{ fontSize: 12.5, color: 'var(--text-soft)', marginBottom: 14, lineHeight: 1.5 }}>
            The table minimum spend is paid directly to The Pre Game Davao via their QR below. This is separate from your entry payment.
          </div>
          <div style={{
            padding: 16, borderRadius: 12, marginBottom: 16, textAlign: 'center',
            background: 'rgba(255,255,255,0.03)', border: '1px solid var(--border-strong)',
          }}>
            {/* Placeholder QR - swap src when Pre Game sends their real QR image */}
            <div style={{
              width: 180, height: 180, margin: '0 auto 12px', borderRadius: 12,
              background: 'repeating-linear-gradient(45deg, rgba(255,255,255,0.06), rgba(255,255,255,0.06) 10px, rgba(255,255,255,0.02) 10px, rgba(255,255,255,0.02) 20px)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              border: '1px dashed var(--border-strong)',
            }}>
              <span style={{ fontSize: 12, color: 'var(--text-soft)', textAlign: 'center', padding: 10 }}>
                Pre Game QR<br />(placeholder)
              </span>
            </div>
            <div className="font-display" style={{ fontSize: 22, fontWeight: 800 }}>{peso(tableSpend)}</div>
            <div style={{ fontSize: 11, color: 'var(--text-soft)', marginTop: 2 }}>minimum spend</div>
          </div>
          <Field label="TABLE PAYMENT REFERENCE" value={tableRef} onChange={setTableRef} placeholder="e.g. 1234567890" mono />
          <ReceiptUpload file={tableReceipt} setFile={setTableReceipt} inputRef={tableRef_input} label="TABLE RECEIPT SCREENSHOT" />
        </SectionCard>
      )}

      {/* LIABILITY */}
      <SectionCard>
        <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
          <input type="checkbox" checked={liability} onChange={(e) => setLiability(e.target.checked)}
            style={{ marginTop: 3, width: 18, height: 18, flexShrink: 0, accentColor: '#FF1B6B' }} />
          <span style={{ fontSize: 12.5, color: 'var(--text-muted)', lineHeight: 1.6 }}>
            I understand that all rules, payments, tickets, and orders inside the bar are held and managed by The Pre Game Davao. Kreation Philippines has no control over the rules or payment structures the bar enforces before or during the party, and Kreation Philippines is not liable for any incident occurring at the bar.
          </span>
        </label>
      </SectionCard>

      {err && (
        <div style={{
          background: 'var(--danger-bg)', color: '#FF6B85', padding: '11px 14px',
          borderRadius: 10, fontSize: 12.5, marginBottom: 14, lineHeight: 1.5,
          border: '1px solid rgba(255,23,68,0.3)',
        }}>{err}</div>
      )}

      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={onBack} disabled={submitting} style={{
          padding: '13px 18px', borderRadius: 12, cursor: 'pointer',
          background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border-strong)',
          color: 'var(--text)', fontWeight: 700, fontSize: 14, fontFamily: 'inherit',
          opacity: submitting ? 0.5 : 1,
        }}>{'\u2190'} Back</button>
        <button onClick={submit} disabled={submitting} style={{
          flex: 1, padding: '13px', borderRadius: 12, border: 'none',
          background: 'linear-gradient(90deg, #FF1B6B, #C724FF)', color: '#fff',
          fontWeight: 700, fontSize: 15, cursor: submitting ? 'wait' : 'pointer', fontFamily: 'inherit',
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        }}>
          {submitting ? <><Spinner size={15} color="#fff" /> Submitting...</> : 'Submit reservation'}
        </button>
      </div>
    </div>
  );
}

function Field({ label, value, onChange, placeholder, type, mono }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 11, letterSpacing: 1, color: 'var(--text-muted)', fontWeight: 700, marginBottom: 6 }}>{label}</div>
      <input type={type || 'text'} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}
        className={mono ? 'font-mono' : ''}
        style={{ width: '100%', padding: '12px 14px', borderRadius: 10, fontSize: 15, boxSizing: 'border-box' }} />
    </div>
  );
}

function PayLine({ label, value, mono }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '5px 0', gap: 10 }}>
      <span style={{ fontSize: 11, letterSpacing: 1, color: 'rgba(255,255,255,0.7)', fontWeight: 600 }}>{label}</span>
      <span className={mono ? 'font-mono' : ''} style={{ fontSize: 14, fontWeight: 700 }}>{value}</span>
    </div>
  );
}

function ReceiptUpload({ file, setFile, inputRef, label }) {
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) { alert('File too large (max 8 MB).'); return; }
    setFile(f);
  };
  return (
    <div>
      <div style={{ fontSize: 11, letterSpacing: 1, color: 'var(--text-muted)', fontWeight: 700, marginBottom: 6 }}>{label}</div>
      <div onClick={() => inputRef.current && inputRef.current.click()} style={{
        padding: 16, borderRadius: 12, cursor: 'pointer', textAlign: 'center',
        background: file ? 'rgba(0,230,118,0.06)' : 'rgba(255,255,255,0.02)',
        border: '1.5px dashed ' + (file ? 'rgba(0,230,118,0.4)' : 'var(--border-strong)'),
      }}>
        <input type="file" ref={inputRef} accept="image/*" onChange={onFile} style={{ display: 'none' }} />
        {file ? (
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--success)' }}>{file.name}</div>
            <div style={{ fontSize: 11, color: 'var(--text-soft)', marginTop: 4 }}>{(file.size / 1024).toFixed(0)} KB {'\u00b7'} tap to change</div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 13, fontWeight: 600 }}>Tap to upload receipt</div>
            <div style={{ fontSize: 11, color: 'var(--text-soft)', marginTop: 4 }}>PNG or JPG, max 8 MB</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// DONE STEP
// ============================================================
function DoneStep({ code }) {
  return (
    <SectionCard>
      <div style={{ textAlign: 'center', padding: '20px 0' }}>
        <div style={{ fontSize: 42, marginBottom: 10 }}>{'\ud83c\udf89'}</div>
        <h2 className="font-headline" style={{ fontSize: 24, margin: '0 0 10px' }}>Reservation received</h2>
        <p style={{ color: 'var(--text-muted)', lineHeight: 1.6, fontSize: 14.5, maxWidth: 460, margin: '0 auto 18px' }}>
          Your reservation is in and awaiting payment verification. Our team checks receipts within 24 hours and will email you once your after-party entry is confirmed.
        </p>
        <div style={{ display: 'inline-block', padding: '10px 18px', borderRadius: 10, background: 'rgba(255,27,107,0.1)', border: '1px solid var(--brand)' }}>
          <div style={{ fontSize: 11, color: 'var(--text-soft)', letterSpacing: 1 }}>YOUR REFERENCE</div>
          <div className="font-mono" style={{ fontSize: 20, fontWeight: 700, color: 'var(--brand)', marginTop: 2 }}>{code}</div>
        </div>
        <p style={{ color: 'var(--text-soft)', fontSize: 12, marginTop: 18 }}>
          Keep this code. Present the lead booker name at the door.
        </p>
      </div>
    </SectionCard>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
